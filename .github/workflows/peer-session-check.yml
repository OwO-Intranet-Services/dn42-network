name: peer-session-check

on:
  pull_request:
    paths:
    - host_vars/*/dn42_peers.yaml
  push:
    branches:
    - main
    paths:
    - host_vars/*/dn42_peers.yaml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Check out repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Write vault password file
      env:
        ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      run: .github/scripts/write-vault-pass.sh

    - name: Install CI dependencies
      run: .github/scripts/setup-ci-venv.sh ansible-core --galaxy collections/requirements.yml

    - name: Resolve diff refs
      id: refs
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
        else
          echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Detect peer session changes
      run: |
        python3 tools/peer_session_diff.py \
          --base-ref "${{ steps.refs.outputs.base }}" \
          --head-ref "${{ steps.refs.outputs.head }}" \
          --json-output peer-session-report.json

    - name: Check explicit peer config form
      run: python3 tools/normalize_peer_configs.py --check

    - name: Run Ansible syntax checks
      run: |
        ansible-playbook playbooks/peer-update.yaml --syntax-check
        ansible-playbook playbooks/wireguard.yaml --syntax-check
        ansible-playbook playbooks/bird.yaml --syntax-check
