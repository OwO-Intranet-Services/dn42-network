name: peer-config-normalize

on:
  pull_request:
    paths:
    - host_vars/*/dn42_peers.yaml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Check out repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install formatter dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install PyYAML

    - name: Resolve diff refs
      id: refs
      run: |
        echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
        echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

    - name: Normalize changed peer files
      env:
        BASE_REF: ${{ steps.refs.outputs.base }}
        HEAD_REF: ${{ steps.refs.outputs.head }}
      run: python3 .github/scripts/normalize-changed-peers.py

    - name: Commit normalized peer files
      run: |
        git diff --quiet --exit-code && exit 0
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add host_vars/*/dn42_peers.yaml
        git commit -m "fix: normalize peer config to explicit form"
        git push
