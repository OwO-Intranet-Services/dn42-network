name: peer-config-normalize

on:
  pull_request:
    paths:
    - host_vars/*/dn42_peers.yaml
  push:
    branches:
    - main
    paths:
    - host_vars/*/dn42_peers.yaml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Check out repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install formatter dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install PyYAML

    - name: Normalize peer files (push)
      if: github.event_name == 'push'
      run: python3 tools/normalize_peer_configs.py

    - name: Normalize changed peer files (PR)
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        BASE_REF: ${{ github.event.pull_request.base.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.sha }}
      run: python3 .github/scripts/normalize-changed-peers.py

    - name: Commit normalized peer files
      run: |
        git diff --quiet --exit-code && exit 0
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add host_vars/*/dn42_peers.yaml
        git commit -m "fix: normalize peer config"
        git push
