name: peer-session-apply

on:
  pull_request:
    paths:
    - host_vars/*/dn42_peers.yaml
  workflow_dispatch:
    inputs:
      deploy_host:
        description: Inventory host to deploy
        required: true
        type: string
      peer_targets:
        description: Peer names as JSON array or comma-separated list
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    peer-session-apply-${{
      github.event_name == 'workflow_dispatch' && inputs.deploy_host
      || format('pr-{0}', github.event.pull_request.number)
    }}
  cancel-in-progress: false

jobs:
  detect:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'iris-as-a-bot'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.export.outputs.has_changes }}
      deploy_matrix: ${{ steps.export.outputs.deploy_matrix }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install detect dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install PyYAML

    - name: Export deploy matrix
      id: export
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.event.pull_request.base.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.sha }}
        DEPLOY_HOST: ${{ inputs.deploy_host }}
        PEER_TARGETS: ${{ inputs.peer_targets }}
      run: python3 .github/scripts/export-deploy-matrix.py

  preflight:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: [ self-hosted, Linux, X64, ipv6, fra-01 ]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        deploy: ${{ fromJson(needs.detect.outputs.deploy_matrix) }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

    - name: Verify runner Python
      run: |
        python3 --version

    - name: Install preflight dependencies
      run: .github/scripts/setup-ci-venv.sh ansible-core PyYAML

    - name: Write vault password file
      env:
        ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      run: .github/scripts/write-vault-pass.sh

    - name: Probe peer endpoints from deploy host
      env:
        DEPLOY_HOST: ${{ matrix.deploy.host }}
        DEPLOY_TARGETS: ${{ toJson(matrix.deploy.targets) }}
      run: python3 .github/scripts/probe-peer-endpoints.py

    - name: Clean up vault password
      if: always()
      run: rm -f .secrets/vault_pass.txt

  apply:
    needs: [ detect, preflight ]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: [ self-hosted, Linux, X64, ipv6, fra-01 ]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        deploy: ${{ fromJson(needs.detect.outputs.deploy_matrix) }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

    - name: Verify runner Python
      run: |
        python3 --version

    - name: Install deployment dependencies
      run: .github/scripts/setup-ci-venv.sh ansible-core --galaxy collections/requirements.yml

    - name: Configure SSH
      env:
        ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
      run: .github/scripts/configure-ssh.sh

    - name: Write vault password file
      env:
        ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      run: .github/scripts/write-vault-pass.sh

    - name: Apply targeted DN42 peer update
      env:
        DEPLOY_HOST: ${{ matrix.deploy.host }}
        DEPLOY_TARGETS_JSON: ${{ toJson(matrix.deploy.targets) }}
      run: |
        python3 -c 'import json,os; print(json.dumps({"peer_update_targets":json.loads(os.environ["DEPLOY_TARGETS_JSON"])}))' > .peer-update-vars.json
        ansible-playbook setup-peer-update.yaml --limit "$DEPLOY_HOST" -e @.peer-update-vars.json

    - name: Clean up secrets
      if: always()
      run: |
        rm -f .secrets/vault_pass.txt
        rm -f ~/.ssh/id_ed25519
