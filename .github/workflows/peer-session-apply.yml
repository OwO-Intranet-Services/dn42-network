name: peer-session-apply

on:
  pull_request:
    paths:
      - host_vars/*/dn42_peers.yaml
  workflow_dispatch:
    inputs:
      deploy_host:
        description: Inventory host to deploy
        required: true
        type: string
      peer_targets:
        description: Peer names as JSON array or comma-separated list
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    peer-session-apply-${{
      github.event_name == 'workflow_dispatch' && inputs.deploy_host
      || format('pr-{0}', github.event.pull_request.number)
    }}
  cancel-in-progress: false

jobs:
  detect:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'iris-as-a-bot'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.export.outputs.has_changes }}
      deploy_matrix: ${{ steps.export.outputs.deploy_matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install PyYAML

      - name: Export deploy matrix
        id: export
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          DEPLOY_HOST: ${{ inputs.deploy_host }}
          PEER_TARGETS: ${{ inputs.peer_targets }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          event_name = os.environ["EVENT_NAME"]
          if event_name == "pull_request":
              subprocess.run(
                  [
                      sys.executable,
                      "tools/peer_session_diff.py",
                      "--base-ref",
                      os.environ["BASE_REF"],
                      "--head-ref",
                      os.environ["HEAD_REF"],
                      "--json-output",
                      "peer-session-report.json",
                  ],
                  check=True,
              )
              with open("peer-session-report.json", "r", encoding="utf-8") as handle:
                  report = json.load(handle)
              has_changes = bool(report["has_changes"])
              deploy_matrix = report["deploy_matrix"]
          else:
              deploy_host = os.environ["DEPLOY_HOST"].strip()
              raw_targets = os.environ["PEER_TARGETS"].strip()
              if not deploy_host:
                  raise SystemExit("deploy_host is required")

              try:
                  parsed = json.loads(raw_targets)
              except json.JSONDecodeError:
                  parsed = [item.strip() for item in raw_targets.split(",") if item.strip()]

              if isinstance(parsed, str):
                  targets = [parsed]
              elif isinstance(parsed, list):
                  targets = [str(item).strip() for item in parsed if str(item).strip()]
              else:
                  raise SystemExit("peer_targets must be a JSON array, JSON string, or comma-separated list")

              if not targets:
                  raise SystemExit("peer_targets must resolve to at least one peer")

              has_changes = True
              deploy_matrix = [{"host": deploy_host, "targets": targets}]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"has_changes={'true' if has_changes else 'false'}\n")
              handle.write(f"deploy_matrix={json.dumps(deploy_matrix)}\n")
          PY

  preflight:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: [self-hosted, Linux, X64, ipv6, fra-01]
    timeout-minutes: 5
    environment: dn42-peer-prod
    strategy:
      fail-fast: false
      matrix:
        deploy: ${{ fromJson(needs.detect.outputs.deploy_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Verify runner Python
        run: |
          python3 --version

      - name: Install preflight dependencies
        run: |
          if ! python3 -m venv .ci-venv; then
            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              PYTHON_VENV_PKG="python$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')-venv"
              sudo apt-get update
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "$PYTHON_VENV_PKG"
              python3 -m venv .ci-venv
            else
              echo "Failed to create a virtualenv and sudo is unavailable to install the matching -venv package."
              exit 1
            fi
          fi
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ansible-core PyYAML

      - name: Configure SSH
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          test -n "$ANSIBLE_SSH_PRIVATE_KEY" || {
            echo "::error::ANSIBLE_SSH_PRIVATE_KEY secret is required for preflight."
            exit 1
          }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ANSIBLE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp .github/ssh_known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Write vault password file
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          test -n "$ANSIBLE_VAULT_PASSWORD" || {
            echo "::error::ANSIBLE_VAULT_PASSWORD secret is required for preflight."
            exit 1
          }
          mkdir -p .secrets
          chmod 700 .secrets
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .secrets/vault_pass.txt
          chmod 600 .secrets/vault_pass.txt

      - name: Probe peer endpoints from deploy host
        env:
          DEPLOY_HOST: ${{ matrix.deploy.host }}
          DEPLOY_TARGETS: ${{ toJson(matrix.deploy.targets) }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          class AnsibleSafeLoader(yaml.SafeLoader):
              pass

          AnsibleSafeLoader.add_constructor(
              "!vault", lambda loader, node: loader.construct_scalar(node)
          )

          host = os.environ["DEPLOY_HOST"]
          targets = set(json.loads(os.environ["DEPLOY_TARGETS"]))
          peers_file = Path("host_vars") / host / "dn42_peers.yaml"
          if not peers_file.is_file():
              print(f"::error title=Preflight failed::{peers_file} not found.")
              sys.exit(1)

          data = yaml.load(peers_file.read_text(), Loader=AnsibleSafeLoader) or {}
          peer_list = data.get("peers") or []

          endpoints: list[tuple[str, str]] = []
          seen_targets: set[str] = set()
          for entry in peer_list:
              bgp = entry.get("bgp") or {}
              asn = bgp.get("asn")
              if asn is None:
                  continue
              target = f"dn42_{str(asn)[-4:]}"
              if target not in targets:
                  continue
              seen_targets.add(target)
              wg = entry.get("wg") or {}
              endpoint = wg.get("endpoint")
              if not endpoint:
                  continue
              host_part = endpoint.rsplit(":", 1)[0].strip("[]")
              endpoints.append((target, host_part))

          missing = targets - seen_targets
          if missing:
              print(f"::notice::Targets not in peers file (likely removals): {sorted(missing)}")

          if not endpoints:
              print("No active peer endpoints to verify; skipping reachability check.")
              sys.exit(0)

          failures: list[tuple[str, str, str]] = []
          for target, host_part in endpoints:
              print(f"::group::{target} endpoint {host_part}")
              cmd = (
                  f"ping -4 -c 2 -W 3 {host_part!r} >/dev/null 2>&1 "
                  f"|| ping -6 -c 2 -W 3 {host_part!r} >/dev/null 2>&1"
              )
              rc = subprocess.run(
                  [
                      "ansible", "-i", "inventory.yaml", host,
                      "-m", "ansible.builtin.shell", "-a", cmd, "-o",
                  ],
                  check=False,
              ).returncode
              print("::endgroup::")
              if rc != 0:
                  failures.append((target, host_part, host))

          if failures:
              for target, host_part, deploy_host in failures:
                  print(
                      f"::error title=Preflight failed::Peer {target} endpoint "
                      f"{host_part} is not reachable from {deploy_host}; "
                      "refusing to apply."
                  )
              sys.exit(1)
          PY

  apply:
    needs: [detect, preflight]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: [self-hosted, Linux, X64, ipv6, fra-01]
    timeout-minutes: 30
    environment: dn42-peer-prod
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        deploy: ${{ fromJson(needs.detect.outputs.deploy_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Verify runner Python
        run: |
          python3 --version

      - name: Install deployment dependencies
        run: |
          if ! python3 -m venv .ci-venv; then
            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              PYTHON_VENV_PKG="python$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')-venv"
              sudo apt-get update
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "$PYTHON_VENV_PKG"
              python3 -m venv .ci-venv
            else
              echo "Failed to create a virtualenv and sudo is unavailable to install the matching -venv package."
              exit 1
            fi
          fi
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ansible-core
          ansible-galaxy collection install -r collections/requirements.yml

      - name: Validate deployment secrets
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          test -n "$ANSIBLE_SSH_PRIVATE_KEY" || {
            echo "ANSIBLE_SSH_PRIVATE_KEY secret is required for deployment."
            exit 1
          }
          test -n "$ANSIBLE_VAULT_PASSWORD" || {
            echo "ANSIBLE_VAULT_PASSWORD secret is required for deployment."
            exit 1
          }

      - name: Configure SSH
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ANSIBLE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp .github/ssh_known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Write vault password file
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          mkdir -p .secrets
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .secrets/vault_pass.txt
          chmod 600 .secrets/vault_pass.txt

      - name: Apply targeted DN42 peer update
        env:
          DEPLOY_HOST: ${{ matrix.deploy.host }}
          DEPLOY_TARGETS_JSON: ${{ toJson(matrix.deploy.targets) }}
        run: |
          python3 - <<'PY' > .peer-update-vars.json
          import json
          import os

          payload = {
              "peer_update_targets": json.loads(os.environ["DEPLOY_TARGETS_JSON"]),
          }
          print(json.dumps(payload))
          PY

          ansible-playbook setup-peer-update.yaml --limit "$DEPLOY_HOST" -e @.peer-update-vars.json
