name: peer-session-apply

on:
  push:
    branches:
      - main
    paths:
      - host_vars/*/dn42_peers.yaml
  workflow_dispatch:
    inputs:
      deploy_host:
        description: Inventory host to deploy
        required: true
        type: string
      peer_targets:
        description: Peer names as JSON array or comma-separated list
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: peer-session-apply-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_host || 'main' }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.export.outputs.has_changes }}
      deploy_matrix: ${{ steps.export.outputs.deploy_matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install PyYAML

      - name: Export deploy matrix
        id: export
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
          DEPLOY_HOST: ${{ inputs.deploy_host }}
          PEER_TARGETS: ${{ inputs.peer_targets }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          event_name = os.environ["EVENT_NAME"]
          if event_name == "push":
              subprocess.run(
                  [
                      sys.executable,
                      "tools/peer_session_diff.py",
                      "--base-ref",
                      os.environ["BASE_REF"],
                      "--head-ref",
                      os.environ["HEAD_REF"],
                      "--json-output",
                      "peer-session-report.json",
                  ],
                  check=True,
              )
              with open("peer-session-report.json", "r", encoding="utf-8") as handle:
                  report = json.load(handle)
              has_changes = bool(report["has_changes"])
              deploy_matrix = report["deploy_matrix"]
          else:
              deploy_host = os.environ["DEPLOY_HOST"].strip()
              raw_targets = os.environ["PEER_TARGETS"].strip()
              if not deploy_host:
                  raise SystemExit("deploy_host is required")

              try:
                  parsed = json.loads(raw_targets)
              except json.JSONDecodeError:
                  parsed = [item.strip() for item in raw_targets.split(",") if item.strip()]

              if isinstance(parsed, str):
                  targets = [parsed]
              elif isinstance(parsed, list):
                  targets = [str(item).strip() for item in parsed if str(item).strip()]
              else:
                  raise SystemExit("peer_targets must be a JSON array, JSON string, or comma-separated list")

              if not targets:
                  raise SystemExit("peer_targets must resolve to at least one peer")

              has_changes = True
              deploy_matrix = [{"host": deploy_host, "targets": targets}]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"has_changes={'true' if has_changes else 'false'}\n")
              handle.write(f"deploy_matrix={json.dumps(deploy_matrix)}\n")
          PY

  apply:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: [self-hosted, Linux, X64, ipv6, fra-01]
    timeout-minutes: 30
    environment: dn42-peer-prod
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        deploy: ${{ fromJson(needs.detect.outputs.deploy_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core
          ansible-galaxy collection install -r collections/requirements.yml

      - name: Validate deployment secrets
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          test -n "$ANSIBLE_SSH_PRIVATE_KEY" || {
            echo "ANSIBLE_SSH_PRIVATE_KEY secret is required for deployment."
            exit 1
          }
          test -n "$ANSIBLE_VAULT_PASSWORD" || {
            echo "ANSIBLE_VAULT_PASSWORD secret is required for deployment."
            exit 1
          }

      - name: Configure SSH
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ANSIBLE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp .github/ssh_known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Write vault password file
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          mkdir -p .secrets
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .secrets/vault_pass.txt
          chmod 600 .secrets/vault_pass.txt

      - name: Apply targeted DN42 peer update
        env:
          DEPLOY_HOST: ${{ matrix.deploy.host }}
          DEPLOY_TARGETS_JSON: ${{ toJson(matrix.deploy.targets) }}
        run: |
          python3 - <<'PY' > .peer-update-vars.json
          import json
          import os

          payload = {
              "peer_update_targets": json.loads(os.environ["DEPLOY_TARGETS_JSON"]),
          }
          print(json.dumps(payload))
          PY

          ansible-playbook setup-peer-update.yaml --limit "$DEPLOY_HOST" -e @.peer-update-vars.json
