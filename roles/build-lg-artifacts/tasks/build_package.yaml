---
- name: Ensure artifact directory exists for {{ lg_package.name }}
  ansible.builtin.file:
    path: "{{ lg_artifacts_root }}/{{ lg_package.name }}"
    state: directory
    mode: "0755"

- name: Get current commit hash for bird-lg-rs
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: "{{ lg_build_workspace }}"
  register: lg_build_current_commit
  changed_when: false

- name: Build cached artifact for {{ lg_package.name }}
  ansible.builtin.include_tasks: "{{ repository_root_dir }}/tasks/build_cached_artifact.yaml"
  vars:
    build_cache_artifact_name: "{{ lg_package.name }} artifact"
    build_cache_artifact_path: "{{ lg_artifacts_root }}/{{ lg_package.name }}/{{ lg_package.name }}"
    build_cache_stamp_path: "{{ lg_artifacts_root }}/{{ lg_package.name }}/last_build_commit"
    build_cache_signature: "{{ lg_build_current_commit.stdout }}"
    build_cache_steps_file: "{{ role_path }}/tasks/build_package_steps.yaml"
    build_cache_pending_message: "Would build {{ lg_package.name }} artifact into {{ lg_artifacts_root }}/{{ lg_package.name }}"
