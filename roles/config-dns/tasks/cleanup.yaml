---
- name: Stop BIND service
  ansible.builtin.systemd:
    name: bind9
    state: stopped
  ignore_errors: true

- name: Disable BIND service
  ansible.builtin.systemd:
    name: bind9
    enabled: false
  ignore_errors: true

- name: Remove immutable flag from resolv.conf
  ansible.builtin.file:
    path: /etc/resolv.conf
    attributes: -i
  ignore_errors: true

- name: Remove existing resolv.conf
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Set DNS to Cloudflare
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Managed by Ansible - Cloudflare DNS
      nameserver 1.1.1.1
      nameserver 1.0.0.1
      nameserver 2606:4700:4700::1111
      nameserver 2606:4700:4700::1001
    owner: root
    group: root
    mode: "0644"
