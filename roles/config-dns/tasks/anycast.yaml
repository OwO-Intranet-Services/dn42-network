---
- name: Build anycast DNS facts
  ansible.builtin.set_fact:
    dns_anycast_ips_v4: "{{ dns_anycast_records | selectattr('ipv4', 'defined') | map(attribute='ipv4') | list }}"
    dns_anycast_ips_v6: "{{ dns_anycast_records | selectattr('ipv6', 'defined') | map(attribute='ipv6') | list }}"
    dns_auto_serial: "{{ ansible_facts['date_time']['epoch'] }}"

- name: Normalize master zones with defaults
  ansible.builtin.set_fact:
    normalized_master_zones: >-
      {%- set res = [] -%}
      {%- for zone in dns_master_zones -%}
        {%- set zone_soa = zone.soa | default({}) -%}
        {%- set updated_soa = zone_soa | combine({'serial': zone_soa.serial | default(dns_auto_serial)}) -%}
        {%- set safe_filename = zone.file | default('db.' + zone.name) | regex_replace('/', '_') -%}
        {%- set _ = res.append(zone | combine({
          'type': 'master',
          'file': safe_filename,
          'origin': zone.origin | default(zone.name + '.'),
          'soa': updated_soa
        })) -%}
      {%- endfor -%}
      {{ res }}

- name: Construct DNS zones list for anycast nodes
  ansible.builtin.set_fact:
    dns_zones: "{{ normalized_master_zones + dns_extra_master_zones + dns_forward_zone_entries }}"
  vars:
    dns_extra_master_zones: >-
      {%- set res = [] -%}
      {%- for domain in dns_extra_domains -%}
        {%- set _ = res.append({
          'name': domain,
          'type': 'master',
          'file': ('db.' + domain) | regex_replace('/', '_'),
          'ttl': 3600,
          'origin': domain + '.',
          'notify': true,
          'allow_transfer': _transfer_defaults,
          'allow_query': ['any'],
          'soa': _soa_defaults
        }) -%}
      {%- endfor -%}
      {{ res }}
    dns_forward_zone_entries: >-
      {%- set res = [] -%}
      {%- for zone in dns_forward_zones_list -%}
        {%- set _ = res.append(
          {'name': zone} | combine(forward_zone_defaults)
        ) -%}
      {%- endfor -%}
      {{ res }}

- name: Build named options for anycast nodes
  ansible.builtin.set_fact:
    dns_named_options_rendered: >-
      {{ dns_named_options | combine(
          {
            'listen_on_v4': (dns_named_options.listen_on_v4 | default([])) + dns_anycast_ips_v4,
            'listen_on_v6': (dns_named_options.listen_on_v6 | default([])) + dns_anycast_ips_v6,
            'extra_statements': (dns_named_options.extra_statements | default([])) + [dns_validate_except_block]
          },
          recursive=True
        )
      }}

- name: Render named.conf.options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: "{{ dns_service.config_dir }}/named.conf.options"
    owner: root
    group: "{{ dns_service.group }}"
    mode: "0644"
  notify: Restart bind9

- name: Render named.conf.local
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: "{{ dns_service.config_dir }}/named.conf.local"
    owner: root
    group: "{{ dns_service.group }}"
    mode: "0644"
  notify: Restart bind9

- name: Ensure ACME challenge include file exists for primary zone
  ansible.builtin.copy:
    dest: "{{ dns_acme_challenge_include_path }}"
    content: |
      ; Generated by Ansible.
      ; No active ACME dns-01 challenges.
    owner: "{{ dns_service.user }}"
    group: "{{ dns_service.group }}"
    mode: "0644"
    force: false

- name: Ensure ACME challenge include file permissions are correct
  ansible.builtin.file:
    path: "{{ dns_acme_challenge_include_path }}"
    owner: "{{ dns_service.user }}"
    group: "{{ dns_service.group }}"
    mode: "0644"

- name: Render DNS zone files
  ansible.builtin.template:
    src: zone.db.j2
    dest: "{{ dns_service.zone_dir }}/{{ zone.file }}"
    owner: "{{ dns_service.user }}"
    group: "{{ dns_service.group }}"
    mode: "0644"
  vars:
    zone: "{{ item }}"
  loop: "{{ dns_zones | selectattr('type', 'equalto', 'master') | list }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart bind9
