---
- name: Add SSH keys for access
  ansible.posix.authorized_key:
    user: "{{ system_shell_account }}"
    state: present
    key: "{{ item }}"
  loop: "{{ system_authorized_keys }}"
  loop_control:
    label: "{{ item | regex_replace('^.* (.*)$', '\\1') }}"

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Ensure hostname resolves in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\d+\.\d+\.\d+\.\d+\s+{{ inventory_hostname }}\b'
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present

- name: Configure interactive shell for the login account
  ansible.builtin.include_tasks:
    file: interactive_shell.yaml

- name: Create automation group for dn42 scripts
  ansible.builtin.group:
    name: "{{ automation_user }}"
    system: false
    state: present
  failed_when: false

- name: Create automation account for dn42 scripts
  ansible.builtin.user:
    name: "{{ automation_user }}"
    group: "{{ automation_user }}"
    system: false
    password: "!"
    home: "{{ automation_user_home }}"
    state: present
  failed_when: false

- name: Set automation user home permissions
  ansible.builtin.file:
    path: "{{ automation_user_home }}"
    state: directory
    owner: "{{ automation_user }}"
    group: "{{ automation_user }}"
    mode: "0755"

- name: Deploy pinned SSH host ed25519 private key
  ansible.builtin.copy:
    content: "{{ ssh_host_ed25519_private_key }}\n"
    dest: /etc/ssh/ssh_host_ed25519_key
    owner: root
    group: root
    mode: "0600"
  when: ssh_host_ed25519_private_key is defined
  notify: restart sshd

- name: Deploy pinned SSH host ed25519 public key
  ansible.builtin.copy:
    content: "{{ ssh_host_ed25519_public_key }}\n"
    dest: /etc/ssh/ssh_host_ed25519_key.pub
    owner: root
    group: root
    mode: "0644"
  when: ssh_host_ed25519_public_key is defined
  notify: restart sshd
