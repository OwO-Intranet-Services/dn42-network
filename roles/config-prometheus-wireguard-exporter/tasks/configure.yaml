---
- name: Deploy wireguard metrics script
  ansible.builtin.copy:
    src: wireguard-metrics.sh
    dest: /usr/local/bin/prometheus-wireguard-metrics.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy wireguard metrics systemd service
  ansible.builtin.template:
    src: wireguard-metrics.service.j2
    dest: /etc/systemd/system/prometheus-wireguard-metrics.service
    owner: root
    group: root
    mode: "0644"

- name: Deploy wireguard metrics systemd timer
  ansible.builtin.template:
    src: wireguard-metrics.timer.j2
    dest: /etc/systemd/system/prometheus-wireguard-metrics.timer
    owner: root
    group: root
    mode: "0644"
  notify: Restart wireguard-metrics timer

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure wireguard metrics timer is running and enabled
  ansible.builtin.service:
    name: prometheus-wireguard-metrics.timer
    state: started
    enabled: true
