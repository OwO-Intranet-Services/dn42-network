---
- name: Get current commit hash for bird-lg-rs
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: "{{ repository_root_dir }}/bird-lg-rs"
  register: network_site_current_commit
  changed_when: false

- name: Build network site input signature
  ansible.builtin.set_fact:
    network_site_build_signature: >-
      {{ {
        'source_commit': network_site_current_commit.stdout,
        'backend_url': network_site_backend_url,
        'autopeer_url': network_site_autopeer_url,
        'autopeer_site_url': network_site_autopeer_site_url,
        'username': network_site_build_username,
      } | to_json }}

- name: Build network site artifact with cache
  ansible.builtin.include_tasks: "{{ repository_root_dir }}/tasks/build_cached_artifact.yaml"
  vars:
    build_cache_artifact_name: network site artifact
    build_cache_artifact_path: "{{ network_site_tarball_path }}"
    build_cache_stamp_path: "{{ network_site_commit_stamp }}"
    build_cache_signature: "{{ network_site_build_signature }}"
    build_cache_steps_file: "{{ role_path }}/tasks/build.yaml"
    build_cache_pending_message: "Would build network site artifact into {{ network_site_artifacts_root }}"
