---
- name: Build DN42 peer descriptors
  ansible.builtin.set_fact:
    wg_dn42_peer_list: "{{ (wg_dn42_peer_list | default([])) + [peer_entry] }}"
  vars:
    peer_name: "{{ dn42_prefix }}{{ (item.bgp.asn | string)[-4:] }}"
    peer_entry:
      name: "{{ peer_name }}"
      interface_name: "{{ peer_name }}"
      port: "{{ item.wg.port | default((item.bgp.asn | string)[-5:]) }}"
      endpoint: "{{ item.wg.endpoint | mandatory }}"
      wg_pubkey: "{{ item.wg.wg_pubkey | mandatory }}"
      peer4: "{{ item.wg.peer4 | default(none) }}"
      peer6: "{{ item.wg.peer6 | default(none) }}"
      own6: "{{ item.wg.own6 | default(none) }}"
      psk: "{{ item.wg.psk | default(none) }}"
      keepalive: "{{ item.wg.keepalive | default(none) }}"
      mtu: "{{ item.wg.mtu | default(wireguard_peer_default_mtu | default(none)) }}"
  loop: "{{ vars[inventory_hostname].peers | default([]) }}"
  loop_control:
    label: "{{ item.bgp.asn }}"
  when:
    - not (item.removed | default(false))
    - target is undefined or
      target == peer_name or
      target == (node_prefix ~ inventory_hostname | replace('-', '_'))

- name: Build removed DN42 peer descriptors
  ansible.builtin.set_fact:
    wg_dn42_removed_peer_list: "{{ (wg_dn42_removed_peer_list | default([])) + [peer_entry] }}"
  vars:
    peer_name: "{{ dn42_prefix }}{{ (item.bgp.asn | string)[-4:] }}"
    peer_entry:
      name: "{{ peer_name }}"
      interface_name: "{{ peer_name }}"
  loop: "{{ vars[inventory_hostname].peers | default([]) }}"
  loop_control:
    label: "{{ item.bgp.asn }}"
  when:
    - remove | default(false)
    - item.removed | default(false)
    - target is undefined or
      target == peer_name or
      target == (node_prefix ~ inventory_hostname | replace('-', '_'))

- name: Remove WireGuard configurations for removed DN42 peers
  ansible.builtin.file:
    path: "/etc/wireguard/{{ peer.name }}.conf"
    state: absent
  loop: "{{ wg_dn42_removed_peer_list | default([]) }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"
  when: (wg_dn42_removed_peer_list | default([])) | length > 0

- name: Stop and disable WireGuard services for removed DN42 peers
  ansible.builtin.systemd:
    name: "wg-quick@{{ peer.interface_name }}"
    state: stopped
    enabled: false
  loop: "{{ wg_dn42_removed_peer_list | default([]) }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.interface_name }}"
  when: (wg_dn42_removed_peer_list | default([])) | length > 0
  failed_when: false

- name: Render per-peer WireGuard configurations for DN42 peers
  ansible.builtin.template:
    src: dn42_tunnel.conf.j2
    dest: "/etc/wireguard/{{ peer.name }}.conf"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ wg_dn42_peer_list | default([]) }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"
  register: dn42_peer_templates
  when:
    - (wg_dn42_peer_list | default([])) | length > 0
    - not (remove | default(false))

- name: Remove per-peer WireGuard configurations
  ansible.builtin.file:
    path: "/etc/wireguard/{{ peer.name }}.conf"
    state: absent
  loop: "{{ wg_dn42_peer_list | default([]) }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"
  when:
    - (wg_dn42_peer_list | default([])) | length > 0
    - remove | default(false)

- name: Set fact for rendered WireGuard peers
  ansible.builtin.set_fact:
    wg_rendered_peers: >-
      {{ (wg_rendered_peers | default([])) + dn42_peer_templates.results }}
  when: dn42_peer_templates is defined

- name: Set fact for removed WireGuard peers
  ansible.builtin.set_fact:
    wg_removed_peers: >-
      {{ (wg_removed_peers | default([])) + dn42_peer_templates.results }}
  when:
    - dn42_peer_templates is defined
    - remove | default(false)
