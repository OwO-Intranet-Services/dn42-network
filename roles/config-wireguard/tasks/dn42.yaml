---
- name: Ensure DN42 peer descriptors exist
  ansible.builtin.set_fact:
    wg_dn42_peers_processed: []

- name: Build DN42 peer descriptors
  ansible.builtin.set_fact:
    wg_dn42_peers_processed: "{{ wg_dn42_peers_processed + [peer_entry] }}"
  vars:
    peer_name: "{{ dn42_prefix }}{{ (item.bgp.asn | string)[-4:] }}"
    peer_entry:
      name: "{{ peer_name }}"
      interface_name: "{{ peer_name }}"
      port: "{{ item.wg.port | default((item.bgp.asn | string)[-5:]) }}"
      endpoint: "{{ item.wg.endpoint | mandatory }}"
      wg_pubkey: "{{ item.wg.wg_pubkey | mandatory }}"
      peer4: "{{ item.wg.peer4 | default(none) }}"
      peer6: "{{ item.wg.peer6 | default(none) }}"
      own6: "{{ item.wg.own6 | default(none) }}"
      psk: "{{ item.wg.psk | default(none) }}"
      keepalive: "{{ item.wg.keepalive | default(none) }}"
      mtu: "{{ item.wg.mtu | default(wireguard_peer_default_mtu | default(none)) }}"
      removed: "{{ item.removed | default(false) }}"
  loop: "{{ hostvars[inventory_hostname].peers | default([]) }}"
  loop_control:
    label: "{{ item.bgp.asn }}"

- name: Filter DN42 peers
  ansible.builtin.set_fact:
    wg_dn42_peers_configure: >-
      {{
        wg_dn42_peers_processed
        | rejectattr('removed')
        | selectattr('name', 'match', target_regex)
        | list
      }}
    wg_dn42_peers_remove: >-
      {{
        wg_dn42_peers_processed
        | selectattr('removed')
        | selectattr('name', 'match', target_regex)
        | list
      }}
  vars:
    target_regex: >-
      {{
        ('^' ~ target ~ '$')
        if target is defined
        else '.*'
      }}

- name: Apply global removal to DN42 peers
  ansible.builtin.set_fact:
    wg_dn42_peers_remove: >-
      {{
        (wg_dn42_peers_remove | default([])) + (wg_dn42_peers_configure | default([]))
        if (remove | default(false))
        else wg_dn42_peers_remove | default([])
      }}
    wg_dn42_peers_configure: >-
      {{
        []
        if (remove | default(false))
        else wg_dn42_peers_configure | default([])
      }}

- name: Render per-peer WireGuard configurations for DN42 peers
  ansible.builtin.template:
    src: dn42_tunnel.conf.j2
    dest: "/etc/wireguard/{{ peer.name }}.conf"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ wg_dn42_peers_configure | default([]) }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"
  register: dn42_peer_templates

- name: Remove per-peer WireGuard configurations
  ansible.builtin.file:
    path: "/etc/wireguard/{{ peer.name }}.conf"
    state: absent
  loop: "{{ wg_dn42_peers_remove | default([]) }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"
  register: dn42_peer_removals

- name: Set fact for rendered WireGuard peers
  ansible.builtin.set_fact:
    wg_rendered_peers: >-
      {{ (wg_rendered_peers | default([])) + dn42_peer_templates.results }}
  when: dn42_peer_templates is defined

- name: Set fact for removed WireGuard peers
  ansible.builtin.set_fact:
    wg_removed_peers: >-
      {{ (wg_removed_peers | default([])) + dn42_peer_removals.results }}
  when: dn42_peer_removals is defined
