---
- name: Normalize DN42 peer inventory
  ansible.builtin.include_tasks: "{{ repository_root_dir }}/tasks/normalize_dn42_peers.yaml"
  vars:
    dn42_inventory_peers: "{{ hostvars[inventory_hostname].peers | default([]) }}"

- name: Initialize DN42 WireGuard peer descriptors
  ansible.builtin.set_fact:
    wg_dn42_peers_processed: []

- name: Build DN42 WireGuard peer descriptors
  ansible.builtin.set_fact:
    wg_dn42_peers_processed: "{{ wg_dn42_peers_processed + [peer_entry] }}"
  vars:
    peer_entry:
      name: "{{ item.name }}"
      interface_name: "{{ item.name }}"
      port: "{{ item.wg.port | default((item.bgp.asn | string)[-5:]) }}"
      endpoint: "{{ item.wg.endpoint | default(none) }}"
      wg_pubkey: "{{ item.wg.wg_pubkey | mandatory }}"
      peer4: "{{ item.wg.peer4 | default(none) }}"
      peer6: "{{ item.wg.peer6 | default(none) }}"
      own6: "{{ item.wg.own6 | default(none) }}"
      psk: "{{ item.wg.psk | default(none) }}"
      keepalive: "{{ item.wg.keepalive | default(none) }}"
      mtu: "{{ item.wg.mtu | default(wireguard_peer_default_mtu | default(none)) }}"
      removed: "{{ item.removed | default(false) }}"
  loop: "{{ dn42_processed_peers }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Split DN42 peers by desired action
  ansible.builtin.set_fact:
    wg_dn42_peers_configure: >-
      {{
        wg_dn42_peers_processed
        | rejectattr('removed')
        | list
      }}
    wg_dn42_peers_remove: >-
      {{
        wg_dn42_peers_processed
        | selectattr('removed')
        | list
      }}

- name: Validate DN42 WireGuard endpoint resolution
  ansible.builtin.include_tasks: "{{ repository_root_dir }}/tasks/validate_wireguard_endpoint_resolution.yaml"
  vars:
    wireguard_endpoint_validation_peers: "{{ wg_dn42_peers_configure }}"
  when: wg_dn42_peers_configure | default([]) | length > 0

- name: Remove peers with unresolvable endpoints from configure list
  ansible.builtin.set_fact:
    wg_dn42_peers_configure: >-
      {{
        wg_dn42_peers_configure
        | rejectattr('name', 'in', wireguard_endpoint_failed_peers)
        | list
      }}
  when: wireguard_endpoint_failed_peers | default([]) | length > 0

- name: Render per-peer WireGuard configurations for DN42 peers
  ansible.builtin.template:
    src: dn42_tunnel.conf.j2
    dest: "/etc/wireguard/{{ peer.name }}.conf"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ wg_dn42_peers_configure | default([]) }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"
  register: dn42_peer_templates
  no_log: true

- name: Set fact for rendered WireGuard peers
  ansible.builtin.set_fact:
    wg_rendered_peers: >-
      {{ (wg_rendered_peers | default([])) + dn42_peer_templates.results }}
  when: dn42_peer_templates is defined

- name: Set fact for removed WireGuard peers
  ansible.builtin.set_fact:
    wg_removed_peers: >-
      {{ (wg_removed_peers | default([])) + [{'peer': peer}] }}
  loop: "{{ wg_dn42_peers_remove | default([]) }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"

- name: Discover existing DN42 WireGuard configurations
  ansible.builtin.find:
    paths: /etc/wireguard
    patterns: "{{ dn42_prefix }}*.conf"
    file_type: file
  register: wg_dn42_existing_configs

- name: Include stale DN42 WireGuard peers in removal list
  ansible.builtin.set_fact:
    wg_removed_peers: >-
      {{ wg_removed_peers + [{'peer': {'name': item, 'interface_name': item}}] }}
  loop: >-
    {{
      wg_dn42_existing_configs.files
      | map(attribute='path')
      | map('basename')
      | map('regex_replace', '\.conf$', '')
      | reject('in', wg_dn42_peers_configure | map(attribute='name') | list)
      | reject('in', wg_dn42_peers_remove | map(attribute='name') | list)
      | list
    }}
  loop_control:
    label: "{{ item }}"
