---
- name: Gather node list for cleanup
  ansible.builtin.set_fact:
    node_hosts: "{{ groups.get(node_group, []) | list }}"

- name: Build WireGuard peer list for cleanup
  ansible.builtin.set_fact:
    wg_cleanup_node_interfaces: "{{ (wg_cleanup_node_interfaces | default([])) + [node_prefix ~ peer | replace('-', '_')] }}"
  loop: "{{ node_hosts }}"
  loop_control:
    loop_var: peer
    label: "{{ peer }}"
  when: peer != inventory_hostname

- name: Build DN42 WireGuard peer list for cleanup
  ansible.builtin.set_fact:
    wg_cleanup_dn42_interfaces: "{{ (wg_cleanup_dn42_interfaces | default([])) + [dn42_prefix ~ (item.bgp.asn | string)[-4:]] }}"
  loop: "{{ hostvars[inventory_hostname].peers | default([]) }}"
  loop_control:
    label: "{{ item.bgp.asn }}"
  when: hostvars[inventory_hostname].peers is defined

- name: Combine all interfaces to cleanup
  ansible.builtin.set_fact:
    wg_all_cleanup_interfaces: "{{ (wg_cleanup_node_interfaces | default([])) + (wg_cleanup_dn42_interfaces | default([])) }}"

- name: Stop WireGuard services
  ansible.builtin.systemd:
    name: "wg-quick@{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ wg_all_cleanup_interfaces }}"
  loop_control:
    label: "{{ item }}"
  ignore_errors: true

- name: Remove WireGuard configuration files
  ansible.builtin.file:
    path: "/etc/wireguard/{{ item }}.conf"
    state: absent
  loop: "{{ wg_all_cleanup_interfaces }}"
  loop_control:
    label: "{{ item }}"
