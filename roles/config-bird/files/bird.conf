# /etc/bird/bird.conf
# Managed by Ansible

include "/etc/bird/node.conf";

log syslog all;
router id OWNIP;
hostname OWNHOSTNAME;

include "/etc/bird/dn42_communities.conf";

roa4 table dn42_roa;
roa6 table dn42_roa_v6;
roa4 table dn42_roa_flap_4;
roa6 table dn42_roa_flap_6;

include "/etc/bird/dn42_filters.conf";

protocol device dev1 {
    scan time 10;
}

protocol direct direct_dn42 {
    ipv4;
    ipv6;
    interface "dn42-dummy", "node_*", "dn42_*", "lo";
}

protocol kernel kernel6 {
    scan time 20;

    ipv6 {
        import none;
        export filter {
            if source = RTS_STATIC && dest != RTD_BLACKHOLE then reject;
            krt_prefsrc = OWNIPv6;
            accept;
        };
    };

    merge paths on;
};

protocol kernel kernel4 {
    scan time 20;

    ipv4 {
        import none;
        export filter {
            if source = RTS_STATIC && dest != RTD_BLACKHOLE then reject;
            krt_prefsrc = OWNIP;
            accept;
        };
    };

    merge paths on;
}

protocol static static_own4 {
    route OWNNET reject;
    route OWNNODENET reject;

    ipv4 { import all; export none; };
}

protocol static static_own6 {
    route OWNNETv6 reject;
    route OWNNODENETv6 reject;

    ipv6 { import all; export none; };
}

protocol static static_blackhole4 {
    route 172.20.0.0/14 blackhole;

    ipv4 { import all; export none; };
}

protocol static static_blackhole6 {
    route fd00::/8 blackhole;

    ipv6 { import all; export none; };
}

include "/etc/bird/rpki.conf";
include "/etc/bird/babel.conf";

template bgp dnpeers {
    local as OWNAS;
    path metric 1;
    advertise hostname on;

    hold time 90;
    keepalive time 30;
    connect retry time 30;
    error wait time 5, 30;

    ipv4 {
        import filter {
          if is_valid_network() && !is_self_net() then {
            if (roa_check(dn42_roa, net, bgp_path.last) != ROA_VALID) then {
              print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
              reject;
            }
            bgp_large_community.add((OWNAS, 100, ROUTER_ID));
            bgp_large_community.add((OWNAS, 101, DN42_REGION));
            accept;
          } else reject;
        };

        export filter {
          if (65535, 65281) ~ bgp_community then reject;
          if (65535, 65282) ~ bgp_community then reject;
          dn42_apply_action_communities();
          if (roa_check(dn42_roa_flap_4, net, bgp_path.last) = ROA_INVALID) then {
              print "[dn42] Flapping Check failed for ", net;
              reject;
          }
          if is_self_net() then {
            if net !~ OWNNETEXACTSET then reject;
          }
          if is_valid_network() && source ~ [RTS_STATIC, RTS_BGP] then {
            accept;
          } else reject; 
        };
        import limit 9000 action block;
    };

    ipv6 {   
        import filter {
          if is_valid_network_v6() && !is_self_net_v6() then {
            if (roa_check(dn42_roa_v6, net, bgp_path.last) != ROA_VALID) then {
              print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
              reject;
            }
            bgp_large_community.add((OWNAS, 100, ROUTER_ID));
            bgp_large_community.add((OWNAS, 101, DN42_REGION));
            accept;
          } else reject;
        };

        export filter {
            if (65535, 65281) ~ bgp_community then reject;
            if (65535, 65282) ~ bgp_community then reject;
            dn42_apply_action_communities();
            if (roa_check(dn42_roa_flap_6, net, bgp_path.last) = ROA_INVALID) then {
                print "[dn42] Flapping Check failed for ", net;
                reject;
            }
            if is_self_net_v6() then {
                if net !~ OWNNETEXACTSETv6 then reject;
            }

            if is_valid_network_v6() && source ~ [RTS_STATIC, RTS_BGP] then {
                accept;
            } else reject; 
        };
        import limit 9000 action block; 
    };
}

template bgp internal_bgp {
    local as OWNAS;

    advertise hostname on;
    require hostname on;

    multihop;
    enable extended messages on;

    ipv4 {
        extended next hop on; 
        gateway recursive; 
        
        import where source = RTS_BGP && is_valid_network() && !is_self_net();
        export where source = RTS_BGP
                     && is_valid_network()
                     && !is_self_net()
                     && bgp_path.len > 0
                     && (65535, 65282) !~ bgp_community;
        next hop self;
        add paths rx;
    };

    ipv6 {
        gateway recursive;
        import where source = RTS_BGP && is_valid_network_v6() && !is_self_net_v6();
        export where source = RTS_BGP
                     && is_valid_network_v6()
                     && !is_self_net_v6()
                     && bgp_path.len > 0
                     && (65535, 65282) !~ bgp_community;
        next hop self;
        add paths rx;
    };
}

include "/etc/bird/dn42_misc.conf";
include "/etc/bird/peers/*";
include "/etc/bird/nodes/*";
