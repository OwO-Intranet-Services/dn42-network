# /etc/bird/dn42_filters.conf
# Managed by Ansible

define DN42_PEERING_STRATEGY_FULL_TABLE = 1;
define DN42_PEERING_STRATEGY_TRANSIT = 2;
define DN42_PEERING_STRATEGY_PEER = 3;
define DN42_PEERING_STRATEGY_DOWNSTREAM = 4;

define DN42_PREF_TRANSITIVE = 100;
define DN42_PREF_DIRECT = 600;
define DN42_PREF_DOWNSTREAM = 700;

function is_self_net() -> bool {
  return net ~ OWNNETSET;
}

function is_self_net_v6() -> bool {
  return net ~ OWNNETSETv6;
}

function is_valid_network() -> bool {
  return net ~ [
    172.20.0.0/14{21,29}, # dn42
    172.20.0.0/24{28,32}, # dn42 Anycast
    172.21.0.0/24{28,32}, # dn42 Anycast
    172.22.0.0/24{28,32}, # dn42 Anycast
    172.23.0.0/24{28,32}, # dn42 Anycast
    172.31.0.0/16+,       # ChaosVPN
    10.100.0.0/14+,       # ChaosVPN
    10.127.0.0/16{16,32}, # neonetwork
    10.0.0.0/8{15,24}     # Freifunk.net
  ];
}

function is_valid_network_v6() -> bool {
  return net ~ [
    fd00::/8{44,64} # ULA address space as per RFC 4193
  ];
}

function is_exact_self_net() -> bool {
  return net ~ OWNNETEXACTSET;
}

function is_exact_self_net_v6() -> bool {
  return net ~ OWNNETEXACTSETv6;
}

function is_exact_self_route() -> bool {
  if is_self_net() then return is_exact_self_net();
  if is_self_net_v6() then return is_exact_self_net_v6();
  return false;
}

function is_valid_dn42_route() -> bool {
  return is_valid_network() || is_valid_network_v6();
}

function is_direct_dn42_route() -> bool {
  return bgp_path.len = 1;
}

function is_downstream_route() -> bool {
  return bgp_local_pref >= DN42_PREF_DOWNSTREAM;
}

function dn42_strategy_imports_only_direct(int peering_strategy) -> bool {
  return peering_strategy = DN42_PEERING_STRATEGY_PEER
    || peering_strategy = DN42_PEERING_STRATEGY_DOWNSTREAM;
}

function dn42_direct_route_pref(int peering_strategy) -> int {
  if peering_strategy = DN42_PEERING_STRATEGY_DOWNSTREAM then return DN42_PREF_DOWNSTREAM;
  return DN42_PREF_DIRECT;
}

function update_latency(int link_latency) -> int { 
    bgp_community.add((64511, link_latency)); 
    
    if (64511, 9) ~ bgp_community then { bgp_community.delete([(64511, 1..8)]); return 9; }
    else if (64511, 8) ~ bgp_community then { bgp_community.delete([(64511, 1..7)]); return 8; }
    else if (64511, 7) ~ bgp_community then { bgp_community.delete([(64511, 1..6)]); return 7; }
    else if (64511, 6) ~ bgp_community then { bgp_community.delete([(64511, 1..5)]); return 6; }
    else if (64511, 5) ~ bgp_community then { bgp_community.delete([(64511, 1..4)]); return 5; }
    else if (64511, 4) ~ bgp_community then { bgp_community.delete([(64511, 1..3)]); return 4; }
    else if (64511, 3) ~ bgp_community then { bgp_community.delete([(64511, 1..2)]); return 3; }
    else if (64511, 2) ~ bgp_community then { bgp_community.delete([(64511, 1..1)]); return 2; }
    else return 1; 
} 

function update_bandwidth(int link_bandwidth) -> int { 
    bgp_community.add((64511, link_bandwidth)); 
    
    if (64511, 21) ~ bgp_community then { bgp_community.delete([(64511, 22..29)]); return 21; }
    else if (64511, 22) ~ bgp_community then { bgp_community.delete([(64511, 23..29)]); return 22; }
    else if (64511, 23) ~ bgp_community then { bgp_community.delete([(64511, 24..29)]); return 23; }
    else if (64511, 24) ~ bgp_community then { bgp_community.delete([(64511, 25..29)]); return 24; }
    else if (64511, 25) ~ bgp_community then { bgp_community.delete([(64511, 26..29)]); return 25; }
    else if (64511, 26) ~ bgp_community then { bgp_community.delete([(64511, 27..29)]); return 26; }
    else if (64511, 27) ~ bgp_community then { bgp_community.delete([(64511, 28..29)]); return 27; }
    else if (64511, 28) ~ bgp_community then { bgp_community.delete([(64511, 29..29)]); return 28; }
    else return 29; 
} 

function update_crypto(int link_crypto) -> int { 
    bgp_community.add((64511, link_crypto)); 
    
    if (64511, 31) ~ bgp_community then { bgp_community.delete([(64511, 32..34)]); return 31; }
    else if (64511, 32) ~ bgp_community then { bgp_community.delete([(64511, 33..34)]); return 32; }
    else if (64511, 33) ~ bgp_community then { bgp_community.delete([(64511, 34..34)]); return 33; }
    else return 34; 
} 

function update_flags(int link_latency; int link_bandwidth; int link_crypto) -> bool { 
    int dn42_latency; 
    int dn42_bandwidth; 
    int dn42_crypto; 
    { 
        dn42_latency = update_latency(link_latency); 
        dn42_bandwidth = update_bandwidth(link_bandwidth) - 20; 
        dn42_crypto = update_crypto(link_crypto) - 30; 
        if dn42_bandwidth > 4 then dn42_bandwidth = 4; 
        return true; 
    } 
} 

function update_geo_flags() -> bool { 
    if is_self_net() || is_self_net_v6() then { 
        bgp_community.add((DN42_COMM, DN42_REGION)); 
        bgp_community.add((DN42_COMM, DN42_COUNTRY)); 
    } 
}

function dn42_import_filter(int link_latency; int link_bandwidth; int link_crypto; int peering_strategy) { 
    if is_valid_network() && !is_self_net() then { 
        if (roa_check(dn42_roa, net, bgp_path.last) != ROA_VALID) then { 
            print "[dn42] IPv4 ROA check failed for ", net, " ASN ", bgp_path.last; 
            reject; 
        } 
        if dn42_strategy_imports_only_direct(peering_strategy) && !is_direct_dn42_route() then reject;
        update_flags(link_latency, link_bandwidth, link_crypto); 
        bgp_local_pref = DN42_PREF_TRANSITIVE;
        if is_direct_dn42_route() then bgp_local_pref = dn42_direct_route_pref(peering_strategy);
        accept; 
    } 
    if is_valid_network_v6() && !is_self_net_v6() then { 
        if (roa_check(dn42_roa_v6, net, bgp_path.last) != ROA_VALID) then { 
            print "[dn42] IPv6 ROA check failed for ", net, " ASN ", bgp_path.last; 
            reject; 
        } 
        if dn42_strategy_imports_only_direct(peering_strategy) && !is_direct_dn42_route() then reject;
        update_flags(link_latency, link_bandwidth, link_crypto); 
        bgp_local_pref = DN42_PREF_TRANSITIVE;
        if is_direct_dn42_route() then bgp_local_pref = dn42_direct_route_pref(peering_strategy);
        accept; 
    } 
    reject; 
} 

function dn42_export_filter(int link_latency; int link_bandwidth; int link_crypto; int peering_strategy) { 
    if !is_valid_dn42_route() then reject;

    if is_self_net() || is_self_net_v6() then {
        if !is_exact_self_route() then reject;
    } else if peering_strategy = DN42_PEERING_STRATEGY_TRANSIT then {
        reject;
    } else if peering_strategy = DN42_PEERING_STRATEGY_PEER then {
        if !is_downstream_route() then reject;
    }

    update_flags(link_latency, link_bandwidth, link_crypto); 
    
    update_geo_flags(); 

    bgp_med = 0; 
    bgp_med = bgp_med + ((4 - (link_crypto - 30)) * 600); 
    bgp_med = bgp_med + ((9 - (link_bandwidth - 20)) * 100); 
    bgp_med = bgp_med + ((link_latency - 1) * 300); 
    accept; 
}
