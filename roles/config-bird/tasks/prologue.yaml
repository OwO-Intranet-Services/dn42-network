---
- name: Setup sysctl for DN42
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/60-dn42.conf
    reload: true
  loop:
    - { name: "net.ipv4.conf.default.rp_filter", value: "0" }
    - { name: "net.ipv4.conf.all.rp_filter", value: "0" }
    - { name: "net.ipv4.ip_forward", value: "1" }
    - { name: "net.ipv6.conf.all.forwarding", value: "1" }

- name: Setup DN42 workspace
  ansible.builtin.file:
    path: "{{ automation_root_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create automation group for dn42 scripts
  ansible.builtin.group:
    name: "{{ automation_user }}"
    system: false

- name: Create automation account for dn42 scripts
  ansible.builtin.user:
    name: "{{ automation_user }}"
    group: "{{ automation_user }}"
    groups: bird
    system: false
    password: "!"
    home: "{{ automation_user_home }}"

- name: Copy dn42 dummy interface config
  ansible.builtin.template:
    src: dn42-interface.j2
    dest: /etc/network/interfaces.d/60-dn42-dummy
    owner: root
    group: root
    mode: "0644"

- name: Ensure dn42-dummy interface is up
  ansible.builtin.shell: |
    ifdown dn42-dummy || true
    ifup dn42-dummy
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: Create /etc/bird/nodes directory
  ansible.builtin.file:
    path: /etc/bird/nodes
    state: directory
    owner: bird
    group: bird
    mode: "0755"

- name: Create /etc/bird/peers directory
  ansible.builtin.file:
    path: /etc/bird/peers
    state: directory
    owner: bird
    group: bird
    mode: "0755"

- name: Ensure BIRD service is running
  ansible.builtin.service:
    name: bird
    state: started
    enabled: true

- name: Render node-specific configuration
  ansible.builtin.template:
    src: node.conf.j2
    dest: /etc/bird/node.conf
    owner: bird
    group: bird
    mode: "0644"

- name: Copy babel configuration
  ansible.builtin.copy:
    src: babel.conf
    dest: /etc/bird/babel.conf
    owner: bird
    group: bird
    mode: "0644"

- name: Copy DN42 community filter configuration
  ansible.builtin.copy:
    src: dn42_filters.conf
    dest: /etc/bird/dn42_filters.conf
    owner: bird
    group: bird
    mode: "0644"

- name: Render DN42 communities configuration
  ansible.builtin.template:
    src: dn42_communities.conf.j2
    dest: /etc/bird/dn42_communities.conf
    owner: bird
    group: bird
    mode: "0644"

- name: Render BIRD RPKI configuration
  ansible.builtin.template:
    src: rpki.conf.j2
    dest: /etc/bird/rpki.conf
    owner: bird
    group: bird
    mode: "0644"

- name: Render DN42 GRC configuration
  ansible.builtin.template:
    src: dn42_grc.conf.j2
    dest: /etc/bird/dn42_grc.conf
    owner: bird
    group: bird
    mode: "0644"

- name: Copy BIRD main configuration
  ansible.builtin.copy:
    src: bird.conf
    dest: /etc/bird/bird.conf
    owner: bird
    group: bird
    mode: "0644"
    validate: bird -p -c %s
  notify: Reload BIRD configuration
