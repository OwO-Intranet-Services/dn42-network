---
- name: Gather node list
  ansible.builtin.set_fact:
    node_hosts: "{{ groups.get(node_group, []) | list }}"

- name: Gather dn42 node list
  ansible.builtin.set_fact:
    node_hosts: "{{ groups.get(dn42_group, []) | list }}"

- name: Run cleanup when removing node
  ansible.builtin.include_tasks:
    file: cleanup.yaml
  when: remove_node | default(false)

- name: End play if removing node
  ansible.builtin.meta: end_host
  when: remove_node | default(false)

- name: Run prologue setup
  ansible.builtin.include_tasks:
    file: prologue.yaml
  when: target is undefined

- name: Render per-node BIRD configurations
  ansible.builtin.template:
    src: node_peer.conf.j2
    dest: "/etc/bird/nodes/{{ node_prefix }}{{ peer | replace('-', '_') }}.conf"
    owner: bird
    group: bird
    mode: '0644'
  loop: "{{ node_hosts }}"
  loop_control:
    loop_var: peer
    label: "{{ peer }}"
  when:
    - peer != inventory_hostname
    - target is undefined
      or target == (node_prefix ~ peer | replace('-', '_'))
      or target == (node_prefix ~ inventory_hostname | replace('-', '_'))
    - not (remove | default(false))
    - task_type is undefined or task_type == 'node'

- name: Remove per-node BIRD configurations
  ansible.builtin.file:
    path: "/etc/bird/nodes/{{ node_prefix }}{{ peer | replace('-', '_') }}.conf"
    state: absent
  loop: "{{ node_hosts }}"
  loop_control:
    loop_var: peer
    label: "{{ peer }}"
  when:
    - peer != inventory_hostname
    - target is undefined
      or target == (node_prefix ~ peer | replace('-', '_'))
      # handled by cleanup task
      # or target == (node_prefix ~ inventory_hostname | replace('-', '_'))
    - remove | default(false)
    - task_type is undefined or task_type == 'node'

- name: Render DN42 peer configurations
  ansible.builtin.template:
    src: dn42_peer.conf.j2
    dest: "/etc/bird/peers/{{ dn42_prefix }}{{ (item.bgp.asn | string)[-4:] }}.conf"
    owner: bird
    group: bird
    mode: '0644'
  loop: "{{ lookup('vars', inventory_hostname).peers | default([]) }}"
  when:
    - lookup('vars', inventory_hostname) is defined and
      lookup('vars', inventory_hostname).peers is defined
    - target is undefined or
      target == (dn42_prefix ~ (item.bgp.asn | string)[-4:]) or
      target == (node_prefix ~ inventory_hostname | replace('-', '_'))
    - not (remove | default(false))
    - not (item.removed | default(false))
    - task_type is undefined or task_type == 'dn42'

- name: Remove removed DN42 peer configurations
  ansible.builtin.file:
    path: "/etc/bird/peers/{{ dn42_prefix }}{{ (item.bgp.asn | string)[-4:] }}.conf"
    state: absent
  loop: "{{ lookup('vars', inventory_hostname).peers | default([]) }}"
  when:
    - lookup('vars', inventory_hostname) is defined and lookup('vars', inventory_hostname).peers is defined
    - target is undefined
      or target == (dn42_prefix ~ (item.bgp.asn | string)[-4:])
      or target == (node_prefix ~ inventory_hostname | replace('-', '_'))
    - item.removed | default(false)
    - task_type is undefined or task_type == 'dn42'

- name: Remove DN42 peer configurations
  ansible.builtin.file:
    path: "/etc/bird/peers/{{ dn42_prefix }}{{ (item.bgp.asn | string)[-4:] }}.conf"
    state: absent
  loop: "{{ lookup('vars', inventory_hostname).peers | default([]) }}"
  when:
    - lookup('vars', inventory_hostname) is defined and lookup('vars', inventory_hostname).peers is defined
    - target is undefined
      or target == (dn42_prefix ~ (item.bgp.asn | string)[-4:])
      # handled by cleanup task
      # or target == (node_prefix ~ inventory_hostname | replace('-', '_'))
    - remove | default(false)
    - task_type is undefined or task_type == 'dn42'

- name: Reload BIRD configurations
  ansible.builtin.command: birdc configure
  register: bird_reconfigure_result
  changed_when: "'Reconfigured' in bird_reconfigure_result.stdout"
  failed_when: bird_reconfigure_result.rc != 0
