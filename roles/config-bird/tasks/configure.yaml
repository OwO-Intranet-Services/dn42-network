---
- name: Gather BIRD inventory inputs
  ansible.builtin.set_fact:
    node_hosts: "{{ groups.get(node_group, []) | list }}"

- name: Run prologue setup
  ansible.builtin.include_tasks:
    file: prologue.yaml

- name: Normalize DN42 peer inventory
  ansible.builtin.include_tasks: "{{ repository_root_dir }}/tasks/normalize_dn42_peers.yaml"
  vars:
    dn42_inventory_peers: "{{ hostvars[inventory_hostname].peers | default([]) }}"

- name: Determine desired BIRD peer lists
  ansible.builtin.set_fact:
    bird_node_peers_configure: >-
      {{
        node_hosts
        | reject('equalto', inventory_hostname)
        | list
      }}
    bird_dn42_peers_configure: >-
      {{
        dn42_processed_peers
        | rejectattr('removed')
        | list
      }}
    bird_dn42_peers_remove: >-
      {{
        dn42_processed_peers
        | selectattr('removed')
        | list
      }}

- name: Discover existing per-node BIRD configurations
  ansible.builtin.find:
    paths: /etc/bird/nodes
    patterns: "{{ node_prefix }}*.conf"
    file_type: file
  register: bird_node_existing_configs

- name: Determine stale per-node BIRD configurations
  ansible.builtin.set_fact:
    bird_node_peers_remove: >-
      {{
        bird_node_existing_configs.files
        | map(attribute='path')
        | map('basename')
        | map('regex_replace', '\\.conf$', '')
        | map('regex_replace', '^' ~ node_prefix, '')
        | map('regex_replace', '_', '-')
        | reject('in', bird_node_peers_configure)
        | list
      }}

- name: Render per-node BIRD configurations
  ansible.builtin.template:
    src: node_peer.conf.j2
    dest: "/etc/bird/nodes/{{ node_prefix }}{{ peer | replace('-', '_') }}.conf"
    owner: bird
    group: bird
    mode: "0644"
  loop: "{{ bird_node_peers_configure }}"
  loop_control:
    loop_var: peer
    label: "{{ peer }}"

- name: Remove per-node BIRD configurations
  ansible.builtin.file:
    path: "/etc/bird/nodes/{{ node_prefix }}{{ peer | replace('-', '_') }}.conf"
    state: absent
  loop: "{{ bird_node_peers_remove }}"
  loop_control:
    loop_var: peer
    label: "{{ peer }}"

- name: Set empty DN42 peer latency map
  ansible.builtin.set_fact:
    dn42_peer_latency_map: "{{ dn42_peer_latency_map | default({}) }}"
    dn42_peer_latency_summary: []

- name: Measure DN42 peer latency communities
  when:
    - bird_dn42_peers_configure | length > 0
  ansible.builtin.include_tasks: "{{ repository_root_dir }}/tasks/measure_dn42_peer_latency.yaml"
  vars:
    dn42_latency_probe_peers: "{{ bird_dn42_peers_configure }}"
    dn42_latency_probe_script_src: "{{ role_path }}/files/dn42_latency_probe.sh"

- name: Render DN42 peer configurations
  ansible.builtin.template:
    src: dn42_peer.conf.j2
    dest: "/etc/bird/peers/{{ item.name }}.conf"
    owner: bird
    group: bird
    mode: "0644"
  loop: "{{ bird_dn42_peers_configure }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove DN42 peer configurations
  ansible.builtin.file:
    path: "/etc/bird/peers/{{ item.name }}.conf"
    state: absent
  loop: "{{ bird_dn42_peers_remove }}"
  loop_control:
    label: "{{ item.name }}"

- name: Discover existing DN42 BIRD peer configurations
  ansible.builtin.find:
    paths: /etc/bird/peers
    patterns: "{{ dn42_prefix }}*.conf"
    file_type: file
  register: bird_dn42_existing_configs

- name: Remove stale DN42 BIRD peer configurations
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{
      bird_dn42_existing_configs.files
      | map(attribute='path')
      | reject('in', bird_dn42_peers_configure | map(attribute='name') | map('regex_replace', '^(.*)$', '/etc/bird/peers/\1.conf') | list)
      | list
    }}
  loop_control:
    label: "{{ item | basename }}"

- name: Reload BIRD configurations
  ansible.builtin.command: birdc configure
  register: bird_reconfigure_result
  changed_when: "'Reconfigured' in bird_reconfigure_result.stdout"
  failed_when: bird_reconfigure_result.rc != 0
