---
- name: Gather BIRD inventory inputs
  ansible.builtin.set_fact:
    node_hosts: "{{ groups.get(node_group, []) | list }}"
    dn42_peers: "{{ hostvars[inventory_hostname].peers | default([]) }}"

- name: Run prologue setup
  ansible.builtin.include_tasks:
    file: prologue.yaml
  when:
    - target is undefined
    - task_type is undefined
    - not (remove | default(false))
    - not (remove_node | default(false))

- name: Initialize BIRD DN42 peer list
  ansible.builtin.set_fact:
    bird_dn42_peers_processed: []

- name: Standardize DN42 peer list
  ansible.builtin.set_fact:
    bird_dn42_peers_processed: "{{ bird_dn42_peers_processed + [item | combine({'name': peer_name, 'removed': item.removed | default(false)})] }}"
  vars:
    peer_name: "{{ dn42_prefix }}{{ (item.bgp.asn | string)[-4:] }}"
  loop: "{{ dn42_peers }}"
  loop_control:
    label: "{{ item.bgp.asn }}"

- name: Determine BIRD target lists
  ansible.builtin.set_fact:
    bird_target_list_node: >-
      {{
        [target | replace(node_prefix, '') | replace('_', '-')]
        if target is defined and target.startswith(node_prefix)
        else (
          [] if target is defined and not target.startswith(node_prefix)
          else node_hosts
        )
      }}
    bird_target_list_dn42: >-
      {{
        [target]
        if target is defined
        else (bird_dn42_peers_processed | map(attribute='name') | list)
      }}

- name: Build BIRD peer selections
  ansible.builtin.set_fact:
    bird_node_peers_selected: >-
      {{
        node_hosts
        | reject('equalto', inventory_hostname)
        | select('in', bird_target_list_node)
        | list
      }}
    bird_dn42_peers_selected: >-
      {{
        bird_dn42_peers_processed
        | selectattr('name', 'in', bird_target_list_dn42)
        | list
      }}

- name: Apply global flags to BIRD peer lists
  ansible.builtin.set_fact:
    bird_node_peers_configure: >-
      {{
        [] if (remove | default(false)) or (task_type is defined and task_type != 'node')
        else bird_node_peers_selected
      }}
    bird_node_peers_remove: >-
      {{
        [] if (not (remove | default(false))) or (task_type is defined and task_type != 'node')
        else bird_node_peers_selected
      }}
    bird_dn42_peers_configure: >-
      {{
        [] if (remove | default(false)) or (task_type is defined and task_type != 'dn42')
        else (bird_dn42_peers_selected | rejectattr('removed') | list)
      }}
    bird_dn42_peers_remove: >-
      {{
        bird_dn42_peers_selected
        if (remove | default(false)) and (task_type is undefined or task_type == 'dn42')
        else (
          [] if (task_type is defined and task_type != 'dn42')
          else (bird_dn42_peers_selected | selectattr('removed') | list)
        )
      }}

- name: Render per-node BIRD configurations
  ansible.builtin.template:
    src: node_peer.conf.j2
    dest: "/etc/bird/nodes/{{ node_prefix }}{{ peer | replace('-', '_') }}.conf"
    owner: bird
    group: bird
    mode: "0644"
  loop: "{{ bird_node_peers_configure }}"
  loop_control:
    loop_var: peer
    label: "{{ peer }}"

- name: Remove per-node BIRD configurations
  ansible.builtin.file:
    path: "/etc/bird/nodes/{{ node_prefix }}{{ peer | replace('-', '_') }}.conf"
    state: absent
  loop: "{{ bird_node_peers_remove }}"
  loop_control:
    loop_var: peer
    label: "{{ peer }}"

- name: Set empty DN42 peer latency map
  ansible.builtin.set_fact:
    dn42_peer_latency_map: "{{ dn42_peer_latency_map | default({}) }}"
    dn42_peer_latency_summary: []

- name: Measure DN42 peer latency communities
  when:
    - task_type is undefined or task_type == 'dn42'
    - bird_dn42_peers_configure | length > 0
  ansible.builtin.include_tasks: "{{ repository_root_dir }}/tasks/measure_dn42_peer_latency.yaml"
  vars:
    dn42_latency_probe_peers: "{{ bird_dn42_peers_configure }}"
    dn42_latency_probe_script_src: "{{ role_path }}/files/dn42_latency_probe.sh"

- name: Render DN42 peer configurations
  ansible.builtin.template:
    src: dn42_peer.conf.j2
    dest: "/etc/bird/peers/{{ item.name }}.conf"
    owner: bird
    group: bird
    mode: "0644"
  loop: "{{ bird_dn42_peers_configure }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove DN42 peer configurations
  ansible.builtin.file:
    path: "/etc/bird/peers/{{ item.name }}.conf"
    state: absent
  loop: "{{ bird_dn42_peers_remove }}"
  loop_control:
    label: "{{ item.name }}"

- name: Reload BIRD configurations
  ansible.builtin.command: birdc configure
  register: bird_reconfigure_result
  changed_when: "'Reconfigured' in bird_reconfigure_result.stdout"
  failed_when: bird_reconfigure_result.rc != 0
