---
- name: Check existing lg server binary
  ansible.builtin.stat:
    path: "{{ automation_root_dir }}/lg/lg-server"
  register: lg_server_binary

- name: Backup current lg server binary
  ansible.builtin.copy:
    src: "{{ automation_root_dir }}/lg/lg-server"
    dest: "{{ automation_root_dir }}/lg/lg-server.backup"
    remote_src: true
    owner: root
    group: nogroup
    mode: "0755"
  when: lg_server_binary.stat.exists

- name: Render lg server config
  ansible.builtin.template:
    src: server-config.json.j2
    dest: "{{ automation_root_dir }}/lg/server-config.json"
    owner: root
    group: nogroup
    mode: "0644"

- name: Get current commit hash for bird-lg-rs
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: "{{ playbook_dir }}/bird-lg-rs"
  delegate_to: localhost
  become: false
  run_once: true
  register: current_commit
  changed_when: false

- name: Read last built commit hash for server
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/.last_build_commit_server"
  delegate_to: localhost
  become: false
  run_once: true
  register: last_build_commit_server
  ignore_errors: true

- name: Build lg-server binary
  when: (last_build_commit_server.failed | default(true)) or (last_build_commit_server['content'] | b64decode | trim != current_commit.stdout)
  block:
    - name: Run cargo build for server
      ansible.builtin.command:
        cmd: cargo zigbuild --target x86_64-unknown-linux-musl -p server -r
        chdir: "{{ playbook_dir }}/bird-lg-rs"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Save current commit hash for server
      ansible.builtin.copy:
        content: "{{ current_commit.stdout }}"
        dest: "{{ playbook_dir }}/.last_build_commit_server"
      delegate_to: localhost
      become: false
      run_once: true

- name: Copy lg server binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/bird-lg-rs/target/x86_64-unknown-linux-musl/release/server"
    dest: "{{ automation_root_dir }}/lg/lg-server"
    owner: root
    group: nogroup
    mode: "0755"
  changed_when: true
  notify: Restart lg-server

- name: Install lg-server systemd service
  ansible.builtin.template:
    src: lg-server.service.j2
    dest: /etc/systemd/system/lg-server.service
    owner: root
    group: root
    mode: "0644"

- name: Ensure lg-server service is enabled and running
  ansible.builtin.systemd:
    name: lg-server.service
    enabled: true
    state: started
    daemon_reload: true
