---
- name: Backup current lg-server binary
  ansible.builtin.include_tasks:
    file: backup_binary.yaml
  vars:
    lg_binary_name: lg-server
    lg_binary_path: "{{ automation_root_dir }}/lg/lg-server"

- name: Render lg server config
  ansible.builtin.template:
    src: server-config.json.j2
    dest: "{{ automation_root_dir }}/lg/server-config.json"
    owner: root
    group: nogroup
    mode: "0644"

- name: Build lg-server binary locally when source changed
  ansible.builtin.include_tasks:
    file: build_binary.yaml
  vars:
    lg_binary_name: lg-server
    lg_cargo_package: server
    lg_build_stamp_file: .last_build_commit_server

- name: Copy lg server binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/bird-lg-rs/target/x86_64-unknown-linux-musl/release/server"
    dest: "{{ automation_root_dir }}/lg/lg-server"
    owner: root
    group: nogroup
    mode: "0755"
  changed_when: true
  notify: Restart lg-server

- name: Install lg-server systemd service
  ansible.builtin.template:
    src: lg-server.service.j2
    dest: /etc/systemd/system/lg-server.service
    owner: root
    group: root
    mode: "0644"

- name: Ensure lg-server service is enabled and running
  ansible.builtin.systemd:
    name: lg-server.service
    enabled: true
    state: started
    daemon_reload: true
