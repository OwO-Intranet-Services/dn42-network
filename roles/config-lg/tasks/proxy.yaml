---
- name: Check existing lg proxy binary
  ansible.builtin.stat:
    path: "{{ automation_root_dir }}/lg/lg-proxy"
  register: lg_proxy_binary

- name: Backup current lg proxy binary
  ansible.builtin.copy:
    src: "{{ automation_root_dir }}/lg/lg-proxy"
    dest: "{{ automation_root_dir }}/lg/lg-proxy.backup"
    remote_src: true
    owner: root
    group: nogroup
    mode: "0755"
  when: lg_proxy_binary.stat.exists

- name: Resolve lg_server hostnames (IPv4)
  ansible.builtin.command: "dig +short A {{ hostvars[item].ansible_host | default(item) }}"
  loop: "{{ groups['lg_server'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: lg_server_v4
  changed_when: false

- name: Resolve lg_server hostnames (IPv6)
  ansible.builtin.command: "dig +short AAAA {{ hostvars[item].ansible_host | default(item) }}"
  loop: "{{ groups['lg_server'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: lg_server_v6
  changed_when: false

- name: Render lg proxy config
  ansible.builtin.template:
    src: proxy-config.json.j2
    dest: "{{ automation_root_dir }}/lg/proxy-config.json"
    owner: root
    group: nogroup
    mode: "0644"

- name: Get current commit hash for bird-lg-rs
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: "{{ playbook_dir }}/bird-lg-rs"
  delegate_to: localhost
  become: false
  run_once: true
  register: current_commit
  changed_when: false

- name: Read last built commit hash for proxy
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/.last_build_commit_proxy"
  delegate_to: localhost
  become: false
  run_once: true
  register: last_build_commit_proxy
  ignore_errors: true

- name: Build lg-proxy binary
  when: (last_build_commit_proxy.failed | default(true)) or (last_build_commit_proxy['content'] | b64decode | trim != current_commit.stdout)
  block:
    - name: Run cargo build for proxy
      ansible.builtin.command:
        cmd: cargo zigbuild --target x86_64-unknown-linux-musl -p proxy -r
        chdir: "{{ playbook_dir }}/bird-lg-rs"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Save current commit hash for proxy
      ansible.builtin.copy:
        content: "{{ current_commit.stdout }}"
        dest: "{{ playbook_dir }}/.last_build_commit_proxy"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

- name: Copy lg proxy binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/bird-lg-rs/target/x86_64-unknown-linux-musl/release/proxy"
    dest: "{{ automation_root_dir }}/lg/lg-proxy"
    owner: root
    group: nogroup
    mode: "0755"
  changed_when: true
  notify: Restart lg-proxy

- name: Setup lg-proxy systemd service
  ansible.builtin.template:
    src: lg-proxy.service.j2
    dest: /etc/systemd/system/lg-proxy.service
    owner: root
    group: root
    mode: "0644"

- name: Ensure lg-proxy service is enabled and running
  ansible.builtin.systemd:
    name: lg-proxy.service
    enabled: true
    state: started
    daemon_reload: true

- name: Copy wg-show wrapper source
  ansible.builtin.copy:
    src: wg-show.c
    dest: "{{ automation_root_dir }}/wg-show.c"
    owner: root
    group: root
    mode: "0644"

- name: Compile wg-show wrapper
  ansible.builtin.command:
    cmd: gcc -o wg-show wg-show.c
    chdir: "{{ automation_root_dir }}"
  changed_when: false

- name: Set permissions on wg-show wrapper
  ansible.builtin.file:
    path: "{{ automation_root_dir }}/wg-show"
    owner: root
    group: "{{ automation_user }}"
    mode: "4750"
  changed_when: false
