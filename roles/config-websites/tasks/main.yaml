---
- name: Download DN42 CA root certificate
  ansible.builtin.get_url:
    url: https://ca.dn42/crt/root-ca.crt
    dest: /usr/local/share/ca-certificates/dn42-ca.crt
    mode: "0644"
    validate_certs: false
  register: dn42_ca_download
  ignore_errors: true

- name: Update CA certificates  # noqa: no-handler
  ansible.builtin.command: update-ca-certificates
  when: dn42_ca_download is changed
  changed_when: true

- name: Create automation bin directory
  ansible.builtin.file:
    path: "{{ automation_user_home }}/bin"
    state: directory
    owner: "{{ automation_user }}"
    group: nogroup
    mode: "0755"

- name: Create automation certs directory
  ansible.builtin.file:
    path: "{{ automation_user_home }}/certs"
    state: directory
    owner: "{{ automation_user }}"
    group: nogroup
    mode: "0755"

- name: Install dn42-cert-client script
  ansible.builtin.copy:
    src: dn42-cert-client.sh
    dest: "{{ automation_user_home }}/bin/dn42-cert-client"
    owner: "{{ automation_user }}"
    group: nogroup
    mode: "0755"

- name: Create DN42 CA token file
  ansible.builtin.copy:
    content: "{{ kioubit_auth_code }}"
    dest: "{{ automation_user_home }}/certs/token.txt"
    owner: "{{ automation_user }}"
    group: nogroup
    mode: "0600"
  when: kioubit_auth_code is defined

- name: Create SSL directory
  ansible.builtin.file:
    path: /etc/caddy/ssl
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'

- name: Deploy Clearnet SSL Certificates
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.secrets/{{ item }}"
    dest: "/etc/caddy/ssl/{{ item }}"
    owner: caddy
    group: caddy
    mode: '0600'
  loop:
    - lg-api.svc.moe.crt
    - lg-api.svc.moe.pem
  when: "'lg-api.svc.moe' in lg_server_domains | default([]) and inventory_hostname in groups.get('lg_server', [])"
  notify: Reload caddy

# FIXME: hardcoded backend URL
- name: Build network site frontend
  ansible.builtin.command:
    cmd: >-
      {{ playbook_dir }}/bird-lg-rs/frontend/build.sh
      --backend-url https://lg-api.iris.dn42
      --username {{ ansible_user }}
      --output {{ playbook_dir }}/dist-network-site
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when: inventory_hostname in groups.get(anycast_group, [])

- name: Create network site directory
  ansible.builtin.file:
    path: /var/www/html/network.iris.dn42
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  when: inventory_hostname in groups.get(anycast_group, [])

- name: Deploy network site static files
  when: inventory_hostname in groups.get(anycast_group, [])
  notify: Reload caddy
  block:
    - name: Compress network site assets # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: tar czf {{ playbook_dir }}/dist-network-site.tar.gz -C {{ playbook_dir }}/dist-network-site .
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Unarchive network site assets
      ansible.builtin.unarchive:
        src: "{{ playbook_dir }}/dist-network-site.tar.gz"
        dest: /var/www/html/network.iris.dn42/
        owner: www-data
        group: www-data

# FIXME: just bad
- name: Build websites list
  ansible.builtin.set_fact:
    all_websites: >-
      {%- set res = websites | default([]) -%}
      {%- set lg_proxy_domain = lg_proxy_domain_fmt | format(inventory_hostname) -%}
      {%- set _ = res.append({
        'name': 'lg-proxy-' + inventory_hostname,
        'server_name': lg_proxy_domain,
        'type': 'lg-proxy',
        'dn42_cert': true,
        'upstream': lg_proxy_listen
      }) -%}
      {%- if lg_server_domains is defined and inventory_hostname in groups.get('lg_server', []) -%}
        {%- for domain in lg_server_domains -%}
          {%- if domain is match('.*\.dn42$') -%}
             {%- set _ = res.append({
               'name': 'lg-server-' + domain | regex_replace('[^a-zA-Z0-9]', '-'),
               'server_name': domain,
               'type': 'lg-server',
               'dn42_cert': true,
               'upstream': lg_server_listen,
               'ssl_cert': automation_user_home + '/certs/' + domain + '/signed.crt',
               'ssl_key': automation_user_home + '/certs/' + domain + '/server.key'
             }) -%}
          {%- elif domain == 'lg-api.svc.moe' -%}
             {%- set _ = res.append({
               'name': 'lg-server-' + domain | regex_replace('[^a-zA-Z0-9]', '-'),
               'server_name': domain,
               'type': 'lg-server',
               'dn42_cert': false,
               'ssl_cert': '/etc/caddy/ssl/lg-api.svc.moe.crt',
               'ssl_key': '/etc/caddy/ssl/lg-api.svc.moe.pem',
               'upstream': lg_server_listen
             }) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {%- if inventory_hostname in groups.get(anycast_group, []) -%}
        {%- set _ = res.append({
          'name': 'network-iris-dn42',
          'server_name': 'network.iris.dn42',
          'type': 'network-site',
          'dn42_cert': true,
          'root': '/var/www/html/network.iris.dn42',
          'listen_ipv4': '172.21.111.111',
          'listen_ipv6': 'fd42:4242:1023::1111:1'
        }) -%}
      {%- endif -%}
      {%- if flapalerted_enabled | default(false) and flapalerted_domain is defined -%}
        {%- set _ = res.append({
          'name': 'flapalerted',
          'server_name': flapalerted_domain,
          'type': 'flapalerted',
          'dn42_cert': true,
          'upstream': flapalerted_http_upstream | default('127.0.0.1:8699')
        }) -%}
      {%- endif -%}
      {{ res }}

- name: Build DN42 websites list for cron
  ansible.builtin.set_fact:
    dn42_websites: >-
      {%- set res = [] -%}
      {%- for site in all_websites -%}
        {%- if site.dn42_cert | default(false) -%}
          {%- if site.server_name is string -%}
             {%- set _ = res.append(site) -%}
          {%- else -%}
             {%- for domain in site.server_name -%}
               {%- if domain is match('.*\.dn42$') -%}
                 {%- set _ = res.append(site | combine({'server_name': domain})) -%}
               {%- endif -%}
             {%- endfor -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ res }}

- name: Create DN42 cert directories per domain
  ansible.builtin.file:
    path: "{{ automation_user_home }}/certs/{{ item.server_name }}"
    state: directory
    owner: "{{ automation_user }}"
    group: caddy
    mode: "2750"
  loop: "{{ dn42_websites }}"
  loop_control:
    label: "{{ item.server_name }}"

- name: Deploy DN42 cert renewal script
  ansible.builtin.template:
    src: dn42-cert-renew.sh.j2
    dest: "{{ automation_user_home }}/bin/dn42-cert-renew"
    owner: "{{ automation_user }}"
    group: nogroup
    mode: "0755"
  when: dn42_websites | length > 0

- name: Allow automation user to reload caddy
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/dn42-automation-caddy
    line: "{{ automation_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl reload caddy"
    create: true
    mode: "0440"
    validate: visudo -cf %s

- name: Set up cron job for DN42 cert renewal (Caddy)
  ansible.builtin.cron:
    name: "DN42 certificate renewal"
    user: "{{ automation_user }}"
    weekday: "0"
    hour: "3"
    minute: "0"
    job: "{{ automation_user_home }}/bin/dn42-cert-renew"
  when: dn42_websites | length > 0

- name: Check DN42 certificates exist
  ansible.builtin.stat:
    path: "{{ automation_user_home }}/certs/{{ item.server_name }}/signed.crt"
  loop: "{{ dn42_websites }}"
  loop_control:
    label: "{{ item.server_name }}"
  register: dn42_cert_check

- name: Request missing DN42 certificates
  ansible.builtin.command:
    cmd: "{{ automation_user_home }}/bin/dn42-cert-client -t {{ automation_user_home }}/certs/token.txt get_certificate {{ item.item.server_name }}"
    chdir: "{{ automation_user_home }}/certs/{{ item.item.server_name }}"
  become: true
  become_user: "{{ automation_user }}"
  loop: "{{ dn42_cert_check.results }}"
  loop_control:
    label: "{{ item.item.server_name }}"
    pause: 2
  when:
    - item.item.dn42_cert | default(false)
    - not item.stat.exists
  register: cert_request_result
  until: cert_request_result.rc == 0
  retries: 3
  delay: 5
  changed_when: cert_request_result.rc == 0

- name: Ensure web roots exist
  ansible.builtin.file:
    path: "{{ item.root | default('/var/www/html/' + item.server_name) }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ all_websites }}"
  loop_control:
    label: "{{ item.server_name }}"
  when:
    - item.type == 'static-site'

- name: Create default index.html for static sites
  ansible.builtin.copy:
    content: "<html><body><h1>Welcome to {{ item.server_name }}</h1></body></html>"
    dest: "{{ item.root | default('/var/www/html/' + item.server_name) }}/index.html"
    force: false
    owner: www-data
    group: www-data
    mode: "0644"
  loop: "{{ all_websites }}"
  loop_control:
    label: "{{ item.server_name }}"
  when: item.type == 'static-site'

- name: Create Caddy conf.d directory
  ansible.builtin.file:
    path: /etc/caddy/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
  notify: Reload caddy

- name: Ensure caddy is running and enabled
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true
