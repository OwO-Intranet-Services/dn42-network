---
- name: Build websites list
  ansible.builtin.set_fact:
    all_websites: >-
      {%- set res = websites | default([]) -%}
      {%- set _ = res.append({
        'name': 'health-' + inventory_hostname + '-svc-moe',
        'server_name': inventory_hostname + '.node.svc.moe',
        'type': 'node-health',
        'dn42_cert': false,
        'metrics': true
      }) -%}
      {%- set _ = res.append({
        'name': 'health-' + inventory_hostname + '-iris-dn42',
        'server_name': inventory_hostname + '.node.iris.dn42',
        'type': 'node-health',
        'dn42_cert': true
      }) -%}
      {%- set lg_proxy_domain = lg_proxy_domain_fmt | format(inventory_hostname) -%}
      {%- set _ = res.append({
        'name': 'lg-proxy-' + inventory_hostname,
        'server_name': lg_proxy_domain,
        'type': 'lg-proxy',
        'dn42_cert': true,
        'upstream': lg_proxy_listen
      }) -%}
      {%- if lg_server_domains is defined and inventory_hostname in groups.get('lg_server', []) -%}
        {%- for domain in lg_server_domains -%}
          {%- if domain is match('.*\\.dn42$') -%}
             {%- set _ = res.append({
               'name': 'lg-server-' + domain | regex_replace('[^a-zA-Z0-9]', '-'),
               'server_name': domain,
               'type': 'lg-server',
               'dn42_cert': true,
               'upstream': lg_server_listen
             }) -%}
          {%- elif domain == 'lg-api.svc.moe' -%}
             {%- set _ = res.append({
               'name': 'lg-server-' + domain | regex_replace('[^a-zA-Z0-9]', '-'),
               'server_name': domain,
               'type': 'lg-server',
               'dn42_cert': false,
               'ssl_cert': '/etc/caddy/ssl/lg-api.svc.moe.crt',
               'ssl_key': '/etc/caddy/ssl/lg-api.svc.moe.pem',
               'upstream': lg_server_listen
             }) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {%- if inventory_hostname in groups.get('autopeer_frontend', []) -%}
        {%- set _ = res.append({
          'name': 'autopeer-' + inventory_hostname,
          'server_name': lg_autopeer_domain,
          'type': 'autopeer-site',
          'dn42_cert': true,
          'root': '/var/www/html/' ~ lg_autopeer_domain,
          'backend_upstream': lg_autopeer_backend_url,
          'backend_host': lg_autopeer_backend_host
        }) -%}
      {%- endif -%}
      {%- if inventory_hostname in groups.get(anycast_group, []) -%}
        {%- set _ = res.append({
          'name': 'network-iris-dn42',
          'server_name': 'network.iris.dn42',
          'type': 'network-site',
          'dn42_cert_dns01': true,
          'root': network_site_root,
          'listen_ipv4': '172.21.111.111',
          'listen_ipv6': 'fd42:4242:1023::1111:1'
        }) -%}
      {%- endif -%}
      {%- if flapalerted_enabled | default(false) and flapalerted_domain is defined -%}
        {%- set _ = res.append({
          'name': 'flapalerted',
          'server_name': flapalerted_domain,
          'type': 'flapalerted',
          'dn42_cert': true,
          'upstream': flapalerted_http_upstream | default('127.0.0.1:8699')
        }) -%}
      {%- endif -%}
      {%- if inventory_hostname in groups.get(anycast_group, []) -%}
        {%- set _ = res.append({
          'name': 'anycast',
          'server_name': 'anycast.iris.dn42',
          'type': 'anycast-site',
          'dn42_cert_dns01': true,
          'listen_ipv4': '172.21.111.111',
          'listen_ipv6': 'fd42:4242:1023::1111:1'
        }) -%}
      {%- endif -%}
      {{ res }}

- name: Ensure web roots exist
  ansible.builtin.file:
    path: "{{ item.root | default('/var/www/html/' + item.server_name) }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ all_websites }}"
  loop_control:
    label: "{{ item.server_name }}"
  when:
    - item.type == 'static-site'

- name: Create default index.html for static sites
  ansible.builtin.copy:
    content: "<html><body><h1>Welcome to {{ item.server_name }}</h1></body></html>"
    dest: "{{ item.root | default('/var/www/html/' + item.server_name) }}/index.html"
    force: false
    owner: www-data
    group: www-data
    mode: "0644"
  loop: "{{ all_websites }}"
  loop_control:
    label: "{{ item.server_name }}"
  when: item.type == 'static-site'

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
  notify: Reload caddy

- name: Ensure caddy is running and enabled
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true
