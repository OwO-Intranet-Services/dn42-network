---
- name: Resolve peer update targets
  ansible.builtin.set_fact:
    peer_update_targets_resolved: >-
      {{
        (
          [target]
          if target is defined and (target | string | trim | length > 0)
          else (
            [peer_update_targets]
            if peer_update_targets is defined and peer_update_targets is string
            else (peer_update_targets | default([]))
          )
        )
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Require peer update targets
  ansible.builtin.assert:
    that:
      - peer_update_targets_resolved | length > 0
    fail_msg: "Set peer_update_targets (list) or target (single peer name) for config-peer-update."

- name: Initialize targeted peer lists
  ansible.builtin.set_fact:
    peer_update_processed_peers: []
    peer_update_wireguard_peers: []
    dn42_peer_latency_map: {}
    dn42_peer_latency_summary: []

- name: Standardize targeted DN42 peers
  ansible.builtin.set_fact:
    peer_update_processed_peers: "{{ peer_update_processed_peers + [item | combine({'name': peer_name, 'removed': item.removed | default(false)})] }}"
  vars:
    peer_name: "{{ dn42_prefix }}{{ (item.bgp.asn | string)[-4:] }}"
  loop: "{{ hostvars[inventory_hostname].peers | default([]) }}"
  loop_control:
    label: "{{ item.bgp.asn }}"

- name: Validate requested peer targets
  ansible.builtin.assert:
    that:
      - peer_update_missing_targets | length == 0
    fail_msg: "Unknown peer update targets for {{ inventory_hostname }}: {{ peer_update_missing_targets | join(', ') }}"
  vars:
    peer_update_known_targets: "{{ peer_update_processed_peers | map(attribute='name') | list }}"
    peer_update_missing_targets: "{{ peer_update_targets_resolved | difference(peer_update_known_targets) | list }}"

- name: Select targeted DN42 peers
  ansible.builtin.set_fact:
    peer_update_selected_peers: >-
      {{
        peer_update_processed_peers
        | selectattr('name', 'in', peer_update_targets_resolved)
        | list
      }}

- name: Build targeted WireGuard peer descriptors
  ansible.builtin.set_fact:
    peer_update_wireguard_peers: "{{ peer_update_wireguard_peers + [peer_entry] }}"
  vars:
    peer_wg: "{{ item.wg if item.wg is mapping else {} }}"
    peer_entry:
      name: "{{ item.name }}"
      interface_name: "{{ item.name }}"
      port: "{{ peer_wg.port | default((item.bgp.asn | string)[-5:]) }}"
      endpoint: "{{ peer_wg.endpoint | default(none) }}"
      wg_pubkey: "{{ peer_wg.wg_pubkey | default(none) }}"
      peer4: "{{ peer_wg.peer4 | default(none) }}"
      peer6: "{{ peer_wg.peer6 | default(none) }}"
      own6: "{{ peer_wg.own6 | default(none) }}"
      psk: "{{ peer_wg.psk | default(none) }}"
      keepalive: "{{ peer_wg.keepalive | default(none) }}"
      mtu: "{{ peer_wg.mtu | default(wireguard_peer_default_mtu | default(none)) }}"
      removed: "{{ item.removed | default(false) }}"
  loop: "{{ peer_update_selected_peers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Split targeted peers by desired action
  ansible.builtin.set_fact:
    peer_update_wireguard_configure: "{{ peer_update_wireguard_peers | rejectattr('removed') | list }}"
    peer_update_wireguard_remove: "{{ peer_update_wireguard_peers | selectattr('removed') | list }}"
    peer_update_bird_configure: "{{ peer_update_selected_peers | rejectattr('removed') | list }}"
    peer_update_bird_remove: "{{ peer_update_selected_peers | selectattr('removed') | list }}"

- name: Validate targeted WireGuard peer inputs
  ansible.builtin.assert:
    that:
      - item.endpoint is not none
      - item.wg_pubkey is not none
    fail_msg: "Peer {{ item.name }} is missing required WireGuard endpoint or public key data."
  loop: "{{ peer_update_wireguard_configure }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure WireGuard and BIRD peer directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "/etc/wireguard", owner: "root", group: "root", mode: "0700" }
    - { path: "/etc/bird/peers", owner: "bird", group: "bird", mode: "0755" }
  loop_control:
    label: "{{ item.path }}"

- name: Read existing remote WireGuard private key
  ansible.builtin.slurp:
    src: "{{ wireguard_private_key_path }}"
  register: peer_update_wireguard_private_key_content
  when: peer_update_wireguard_configure | length > 0
  no_log: true

- name: Set WireGuard private key for targeted peer updates
  ansible.builtin.set_fact:
    wireguard_private_key: "{{ peer_update_wireguard_private_key_content.content | b64decode | trim }}"
  when: peer_update_wireguard_configure | length > 0
  no_log: true

- name: Render targeted WireGuard peer configurations
  ansible.builtin.template:
    src: "{{ role_path }}/../config-wireguard/templates/dn42_tunnel.conf.j2"
    dest: "/etc/wireguard/{{ peer.name }}.conf"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ peer_update_wireguard_configure }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"
  register: peer_update_wireguard_templates

- name: Remove targeted WireGuard peer configurations
  ansible.builtin.file:
    path: "/etc/wireguard/{{ peer.name }}.conf"
    state: absent
  loop: "{{ peer_update_wireguard_remove }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"
  register: peer_update_wireguard_removals

- name: Restart targeted WireGuard services when configuration changes
  ansible.builtin.systemd:
    name: "wg-quick@{{ item.peer.interface_name }}"
    state: restarted
  loop: "{{ peer_update_wireguard_templates.results | default([]) }}"
  loop_control:
    label: "{{ item.peer.interface_name }}"
  when: item.changed
  timeout: 10

- name: Ensure targeted WireGuard services are enabled and started
  ansible.builtin.systemd:
    name: "wg-quick@{{ item.interface_name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ peer_update_wireguard_configure }}"
  loop_control:
    label: "{{ item.interface_name }}"

- name: Ensure removed WireGuard services are stopped and disabled
  ansible.builtin.systemd:
    name: "wg-quick@{{ item.interface_name }}"
    state: stopped
    enabled: false
  loop: "{{ peer_update_wireguard_remove }}"
  loop_control:
    label: "{{ item.interface_name }}"

- name: Copy latency probe script
  ansible.builtin.copy:
    src: "{{ role_path }}/../config-bird/files/dn42_latency_probe.sh"
    dest: /usr/local/bin/dn42_latency_probe.sh
    mode: "0755"
  when: peer_update_bird_configure | length > 0

- name: Ping targeted DN42 peer endpoints
  ansible.builtin.shell:
    cmd: "/usr/local/bin/dn42_latency_probe.sh {{ item.wg.endpoint | default('') }} {{ dn42_latency_ping_count }} {{ dn42_latency_ping_timeout }}"
  async: "{{ ((dn42_latency_ping_count | int) * (dn42_latency_ping_timeout | int)) + 10 }}"
  poll: 0
  register: peer_update_latency_async_jobs
  loop: "{{ peer_update_bird_configure }}"
  loop_control:
    label: "{{ item.name }}"
  when: peer_update_bird_configure | length > 0
  changed_when: false
  failed_when: false

- name: Collect targeted DN42 latency results
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: peer_update_latency_results
  until: peer_update_latency_results.finished
  retries: "{{ ((dn42_latency_ping_count | int) * (dn42_latency_ping_timeout | int)) + 10 }}"
  delay: 1
  loop: "{{ peer_update_latency_async_jobs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - peer_update_latency_async_jobs is defined
    - not (item.skipped | default(false))
  changed_when: false
  failed_when: false

- name: Simplify targeted DN42 latency probe stdout
  ansible.builtin.set_fact:
    dn42_peer_latency_summary: "{{ dn42_peer_latency_summary + [_summary] }}"
  vars:
    _raw_stdout: "{{ item.stdout | default('failed:0') }}"
    _peer_name: "{{ item.item.item.name }}"
    _summary: "{{ {'peer': _peer_name, 'stdout': _raw_stdout} }}"
  loop: "{{ peer_update_latency_results.results | default([]) }}"
  loop_control:
    label: "{{ _summary }}"
  when:
    - peer_update_latency_results is defined
    - not (item.skipped | default(false))

- name: Record targeted latency communities
  ansible.builtin.set_fact:
    dn42_peer_latency_map: "{{ dn42_peer_latency_map | combine({_peer_name: _latency_value}) }}"
  vars:
    _raw_stdout: "{{ item.stdout | default('failed:0') }}"
    _status: "{{ 'success' if _raw_stdout.split(':')[0] == 'success' else 'failed' }}"
    _latency_ms: "{{ (_raw_stdout.split(':')[1] | float) if _status == 'success' else 0 }}"
    _peer_name: "{{ item.peer }}"
    _latency_value: >-
      {% if _status == 'success' %}
      {% set buckets = dn42_latency_communities | dictsort %}
      {% set bucket = namespace(value=dn42_latency_community_default) %}
      {% for community, bounds in buckets %}
      {% if bucket.value == dn42_latency_community_default and _latency_ms <= bounds[1] %}
      {% set bucket.value = community | int %}
      {% endif %}
      {% endfor %}
      {{ bucket.value }}
      {% else %}
      {{ dn42_latency_community_default }}
      {% endif %}
  loop: "{{ dn42_peer_latency_summary | default([]) }}"
  loop_control:
    label: "{{ item.peer }}"
  when: dn42_peer_latency_summary | length > 0

- name: Render targeted BIRD peer configurations
  ansible.builtin.template:
    src: "{{ role_path }}/../config-bird/templates/dn42_peer.conf.j2"
    dest: "/etc/bird/peers/{{ item.name }}.conf"
    owner: bird
    group: bird
    mode: "0644"
  loop: "{{ peer_update_bird_configure }}"
  loop_control:
    label: "{{ item.name }}"
  register: peer_update_bird_templates

- name: Remove targeted BIRD peer configurations
  ansible.builtin.file:
    path: "/etc/bird/peers/{{ item.name }}.conf"
    state: absent
  loop: "{{ peer_update_bird_remove }}"
  loop_control:
    label: "{{ item.name }}"
  register: peer_update_bird_removals

- name: Determine whether targeted BIRD reload is required
  ansible.builtin.set_fact:
    peer_update_bird_reload_required: >-
      {{
        (
          (peer_update_bird_templates.results | default([]))
          + (peer_update_bird_removals.results | default([]))
        )
        | selectattr('changed')
        | list
        | length > 0
      }}

- name: Reload BIRD after targeted peer updates
  ansible.builtin.command: birdc configure
  register: peer_update_bird_reconfigure_result
  changed_when: "'Reconfigured' in peer_update_bird_reconfigure_result.stdout"
  failed_when: peer_update_bird_reconfigure_result.rc != 0
  when: peer_update_bird_reload_required
