---
- name: Create textfile collector directory
  ansible.builtin.file:
    path: "{{ prometheus_textfile_directory }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure node exporter systemd override
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus-node-exporter

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure prometheus-node-exporter is running and enabled
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true
