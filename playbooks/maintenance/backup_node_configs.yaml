---
- name: Backup node configs
  hosts: dn42
  gather_facts: false
  vars:
    backup_root: "./backups/node_configs"

  tasks:
    - name: Ensure local WireGuard backup directory exists
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ inventory_hostname }}/wireguard"
        state: directory
        mode: "0750"
      delegate_to: localhost

    - name: Ensure local BIRD peer backup directory exists
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ inventory_hostname }}/bird/peers"
        state: directory
        mode: "0750"
      delegate_to: localhost

    - name: Locate WireGuard config files
      become: true
      ansible.builtin.find:
        paths: /etc/wireguard
        patterns: "*.conf"
        file_type: file
      register: wg_conf_files

    - name: Fetch WireGuard configs to local backup
      become: true
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ backup_root }}/{{ inventory_hostname }}/wireguard/"
        flat: true
      loop: "{{ wg_conf_files.files }}"

    - name: Locate BIRD peer config files
      become: true
      ansible.builtin.find:
        paths: /etc/bird/peers
        patterns: "*.conf"
        file_type: file
      register: bird_conf_files

    - name: Fetch BIRD peer configs to local backup
      become: true
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ backup_root }}/{{ inventory_hostname }}/bird/peers/"
        flat: true
      loop: "{{ bird_conf_files.files }}"
