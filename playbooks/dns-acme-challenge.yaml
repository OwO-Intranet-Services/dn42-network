---
- name: Publish ACME dns-01 challenge records
  hosts: "{{ dns_acme_challenge_target_group | default('anycast') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    repository_root_dir: "{{ playbook_dir | dirname }}"
  pre_tasks:
    - name: Assert ACME challenge records are provided as a list
      ansible.builtin.assert:
        that:
          - dns_acme_challenge_records is defined
          - dns_acme_challenge_records | type_debug == 'list'
        fail_msg: dns_acme_challenge_records must be supplied as a list.

    - name: Assert ACME challenge records are well formed
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.values is defined
          - item.values | type_debug == 'list'
        fail_msg: ACME challenge records must provide name and values fields.
      loop: "{{ dns_acme_challenge_records }}"
      loop_control:
        label: "{{ item.name }}"

  tasks:
    - name: Read current ACME challenge include file
      ansible.builtin.slurp:
        src: "{{ dns_acme_challenge_include_path }}"
      register: dns_acme_challenge_include_existing
      failed_when: false
      changed_when: false

    - name: Publish and validate ACME challenge include file
      block:
        - name: Render ACME challenge include file
          ansible.builtin.template:
            src: "{{ repository_root_dir }}/roles/config-dns/templates/acme-challenge.include.j2"
            dest: "{{ dns_acme_challenge_include_path }}"
            owner: "{{ dns_service.user }}"
            group: "{{ dns_service.group }}"
            mode: "0644"
          register: dns_acme_challenge_include_render

        - name: Validate authoritative zone after ACME challenge update
          ansible.builtin.command:
            argv:
              - named-checkzone
              - "{{ domain_name }}"
              - "{{ dns_service.zone_dir }}/{{ dns_primary_zone_file }}"
          changed_when: false

        - name: Reload authoritative zone after ACME challenge update
          ansible.builtin.command:
            argv:
              - rndc
              - reload
              - "{{ domain_name }}"
          when: dns_acme_challenge_include_render.changed
          changed_when: dns_acme_challenge_include_render.changed

      rescue:
        - name: Restore previous ACME challenge include file
          ansible.builtin.copy:
            dest: "{{ dns_acme_challenge_include_path }}"
            content: "{{ (dns_acme_challenge_include_existing.content | b64decode) if (dns_acme_challenge_include_existing.content is defined) else '; Generated by Ansible.\n; No active ACME dns-01 challenges.\n' }}"
            owner: "{{ dns_service.user }}"
            group: "{{ dns_service.group }}"
            mode: "0644"

        - name: Fail ACME challenge publication
          ansible.builtin.fail:
            msg: "Failed to publish dns-01 challenge records on {{ inventory_hostname }}."
