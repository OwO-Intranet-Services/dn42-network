---
- name: Validate WireGuard endpoint resolution
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable | default('python3') }}"
      - -c
      - |
        import socket
        import sys

        host = sys.argv[1]
        try:
            socket.getaddrinfo(host, None)
        except OSError as exc:
            raise SystemExit(f"failed to resolve {host}: {exc}")
      - "{{ wireguard_endpoint_host }}"
  vars:
    wireguard_endpoint_host: >-
      {{
        peer.endpoint[1:].split(']:', 1)[0]
        if peer.endpoint.startswith('[')
        else peer.endpoint.rsplit(':', 1)[0]
      }}
  loop: "{{ wireguard_endpoint_validation_peers | selectattr('endpoint') | list }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"
  changed_when: false
  failed_when: false
  register: wireguard_endpoint_validation_results

- name: Identify peers with unresolvable endpoints
  ansible.builtin.set_fact:
    wireguard_endpoint_failed_peers: >-
      {{
        wireguard_endpoint_validation_results.results
        | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', 'ne', 0)
        | map(attribute='peer')
        | map(attribute='name')
        | list
      }}

- name: Warn about peers with unresolvable endpoints
  ansible.builtin.debug:
    msg: "Skipping peer {{ item }} — endpoint failed to resolve"
  loop: "{{ wireguard_endpoint_failed_peers }}"
  when: wireguard_endpoint_failed_peers | length > 0
