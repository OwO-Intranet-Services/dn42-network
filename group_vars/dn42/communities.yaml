  JP: 1392 # Japan
  KR: 1410 # South Korea
  KZ: 1398 # Kazakhstan
  MY: 1458 # Malaysia
  NL: 1528 # Netherlands
  NO: 1578 # Norway
  NZ: 1554 # New Zealand
