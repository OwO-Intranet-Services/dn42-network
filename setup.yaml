---
- name: System Configuration
  hosts: dn42
  become: true
  gather_facts: true
  roles:
    - config-system

- name: Network Configuration
  hosts: dn42
  become: true
  gather_facts: true
  roles:
    - config-wireguard
    - config-bird

- name: Services Configuration
  hosts: dn42
  become: true
  gather_facts: true
  roles:
    - config-dns
    - role: config-lg
      lg_configure_proxy: true
      lg_configure_server: false

- name: Looking Glass Server
  hosts: lg_server
  become: true
  gather_facts: true
  roles:
    - role: config-lg
      lg_configure_proxy: false
      lg_configure_server: true
